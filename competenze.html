<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decodifica Competenze Riforma 2017 | Orfini Lab</title>
    <meta name="description" content="Strumento interattivo per la decodifica delle competenze, abilità e conoscenze della Riforma 2017 per gli Istituti Professionali.">
    <meta name="keywords" content="Riforma 2017, Competenze, Abilità, Conoscenze, Istituti Professionali, Matematica, Fabbricazione Digitale">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Space+Mono:wght@700&family=Syne:wght@800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00bcd4;
            --secondary: #ff4081;
            --accent: #ffeb3b;
            --bg: #050510;
            --card-bg: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.1);
            --glass: rgba(10, 20, 40, 0.7);
            --font-ui: 'Inter', sans-serif;
        }

        /* --- NAVIGATION (Shared) --- */
        #main-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(10, 20, 40, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
        }

        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .brand-container { display: flex; flex-direction: column; }
        .brand-orfini { font-family: 'Syne', sans-serif; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1; color: #fff; text-transform: uppercase; }
        .brand-sub { font-family: 'Space Mono', monospace; font-size: 0.65rem; color: var(--primary); letter-spacing: 0.25em; margin-top: 0.2rem; }

        .nav-links {
            display: flex;
            align-items: stretch;
            flex: 1;
            justify-content: center;
            gap: 0;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .nav-tab {
            background: transparent;
            border: none;
            border-right: 1px solid var(--border);
            color: #888;
            font-family: var(--font-ui);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            padding: 0.7rem 1.2rem;
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-tab:last-child { border-right: none; }

        .nav-tab:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-tab.active {
            background: #fff !important;
            color: #000 !important;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: #eee;
            font-family: 'Inter', sans-serif;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(0, 188, 212, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 64, 129, 0.05) 0%, transparent 40%);
            min-height: 100dvh;
            min-height: -webkit-fill-available;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
        }

        header {
            padding: 3rem 2rem;
            text-align: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            margin-bottom: 0.5rem;
            letter-spacing: -0.04em;
            background: linear-gradient(90deg, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #888;
            max-width: 700px;
            margin: 0 auto;
        }

        main {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 0 1.5rem 4rem 1.5rem;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 2rem;
        }

        .sidebar {
            position: sticky;
            top: 2rem;
            height: fit-content;
        }

        .search-container {
            margin-bottom: 2rem;
            position: relative;
        }

        #search {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            font-family: inherit;
            outline: none;
            transition: all 0.3s;
        }

        #search:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 188, 212, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.5;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .nav-btn {
            padding: 1rem;
            text-align: left;
            background: transparent;
            border: 1px solid transparent;
            color: #888;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.03);
            color: #fff;
        }

        .nav-btn.active {
            background: rgba(0, 188, 212, 0.1);
            color: var(--primary);
            border-color: rgba(0, 188, 212, 0.2);
        }

        .content-area {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
        }

        .section-header {
            border-left: 4px solid var(--primary);
            padding-left: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .section-header h2 {
            font-size: 1.8rem;
            font-weight: 800;
        }

        .section-header p {
            color: #888;
            font-size: 0.95rem;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .skill-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .skill-card:hover {
            border-color: rgba(255,255,255,0.2);
            transform: translateY(-4px);
            background: rgba(255,255,255,0.06);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .id-badge {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--primary);
            background: rgba(0, 188, 212, 0.1);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .type-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #666;
            font-weight: 800;
        }

        .card-content {
            font-size: 1.05rem;
            line-height: 1.5;
            font-weight: 500;
            color: #ddd;
        }

        .linked-items {
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .link-title {
            font-size: 0.7rem;
            font-weight: 800;
            color: #555;
            text-transform: uppercase;
        }

        .link-text {
            font-size: 0.85rem;
            color: #888;
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
                margin-bottom: 2rem;
            }
        }

        /* Ambient effects */
        .skill-card::after {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 100px; height: 100px;
            background: radial-gradient(circle at top right, rgba(0, 188, 212, 0.05), transparent);
            pointer-events: none;
        }

        .active-section-indicator {
            color: var(--accent);
            font-size: 0.8rem;
            margin-top: 0.5rem;
            display: block;
        }
    </style>
</head>

<body>
    <nav id="main-nav">
        <div class="nav-content">
            <div class="brand-container">
                <div class="brand-orfini">ORFINI</div>
                <div class="brand-sub">MATH LAB</div>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-tab">Home</a>
                <a href="verifiche.html" class="nav-tab">Archivio Verifiche</a>
                <a href="competenze.html" class="nav-tab active">Riforma 2017</a>
            </div>
        </div>
    </nav>

    <header>
        <h1>Decodifica Competenze</h1>
        <p class="subtitle">Mappa organica della Riforma degli Istituti Professionali (D.Lgs. 61/2017). Esplora il legame tra SAPERE e SAPER FARE.</p>
    </header>

    <main>
        <aside class="sidebar">
            <div class="search-container">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search" placeholder="Cerca codice o parola..." aria-label="Cerca i codici competenza">
            </div>

            <nav class="nav-menu" id="nav-menu">
                <button class="nav-btn active" data-target="area_generale_matematica">
                    <span>📐</span> Area Matematica
                </button>
                <button class="nav-btn" data-target="area_indirizzo_tecnico">
                    <span>🛠️</span> Area Professionale
                </button>
                <button class="nav-btn" data-target="competenze_cittadinanza">
                    <span>🌍</span> Cittadinanza
                </button>
                <button class="nav-btn" data-target="competenze_trasversali_soft_skills">
                    <span>🧠</span> Soft Skills
                </button>
            </nav>
        </aside>

        <div class="content-area" id="content-container">
            <!-- Content will be injected here -->
        </div>
    </main>

    <script>
        let schemaData = null;
        let activeCategory = 'area_generale_matematica';

        async function init() {
            try {
                const response = await fetch('./riforma2017.json');
                schemaData = await response.json();
                renderContent();
                
                // Event Listeners
                document.getElementById('nav-menu').addEventListener('click', (e) => {
                    const btn = e.target.closest('.nav-btn');
                    if(btn) {
                        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        activeCategory = btn.dataset.target;
                        renderContent();
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }
                });

                document.getElementById('search').addEventListener('input', (e) => {
                    const term = e.target.value.toLowerCase();
                    renderContent(term);
                });

            } catch (err) {
                console.error("Error loading Riforma data:", err);
            }
        }

        function createCard(item, type) {
            return `
                <div class="skill-card">
                    <div class="card-header">
                        <span class="type-tag">${type}</span>
                        <span class="id-badge">${item.id}</span>
                    </div>
                    <div class="card-content">
                        ${item.label}
                    </div>
                </div>
            `;
        }

        function renderContent(filter = '') {
            const container = document.getElementById('content-container');
            container.innerHTML = '';

            const data = schemaData[activeCategory];
            if (!data) return;

            // Se è una lista semplice (CIT o SOFT)
            if (Array.isArray(data)) {
                const filtered = data.filter(item => 
                    item.id.toLowerCase().includes(filter) || 
                    item.label.toLowerCase().includes(filter)
                );
                
                if(filtered.length > 0) {
                    const section = document.createElement('div');
                    section.innerHTML = `
                        <div class="section-header">
                            <h2>${activeCategory.replace(/_/g, ' ').toUpperCase()}</h2>
                            <p>${filtered.length} elementi identificati</p>
                        </div>
                        <div class="grid-layout">
                            ${filtered.map(item => createCard(item, 'Competenza')).join('')}
                        </div>
                    `;
                    container.appendChild(section);
                }
            } 
            // Se è un'area complessa (MAT o IND)
            else {
                Object.keys(data).forEach(subKey => {
                    const items = data[subKey];
                    const filtered = items.filter(item => 
                        item.id.toLowerCase().includes(filter) || 
                        item.label.toLowerCase().includes(filter)
                    );

                    if (filtered.length > 0) {
                        const section = document.createElement('div');
                        const typeLabel = subKey.includes('competenze') ? 'Competenze' : 
                                          subKey.includes('abilita') ? 'Abilità' : 'Conoscenze';
                        
                        section.innerHTML = `
                            <div class="section-header">
                                <h2>${typeLabel}</h2>
                                <p>${filtered.length} elementi nell'area ${subKey.replace(/_/g, ' ')}</p>
                            </div>
                            <div class="grid-layout">
                                ${filtered.map(item => createCard(item, typeLabel.slice(0, -1))).join('')}
                            </div>
                        `;
                        container.appendChild(section);
                    }
                });
            }

            if(container.innerHTML === '') {
                container.innerHTML = '<div style="text-align:center; padding: 4rem; color: #555;">Nessun risultato trovato per la ricerca.</div>';
            }
        }

        init();
    </script>
</body>

</html>
