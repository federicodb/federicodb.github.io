<!DOCTYPE html>
<html lang="it">
<head>

    <!-- L'app vive su Google AI Studio, che inserisce la chiave Gemini tramite il suo proxy:
         gli studenti non devono avere né incollare una chiave. Qui la si incorpora a tutta pagina. -->
    <style>
        :root { color-scheme: dark; --bar: 44px; }
        html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: Inter, system-ui, -apple-system, sans-serif; }
        body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
        .bar {
            flex: none; height: var(--bar); display: flex; align-items: center; gap: 10px;
            padding: 0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
            background: #0a0a0a; border-bottom: 1px solid #262626; font-size: 13px;
        }
        .bar a { color: #d4d4d4; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; border: 1px solid #262626; white-space: nowrap; }
        .bar a:hover, .bar a:focus-visible { color: #fff; border-color: #6366f1; outline: none; }
        .bar .title { flex: 1; min-width: 0; text-align: center; color: #a3a3a3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .bar .title b { color: #fff; }
        /* il pulsante del sito è già nella barra: niente FAB sovrapposto all'app */
        .bar .orfini-back-btn { position: static !important; width: auto !important; height: auto !important; box-shadow: none !important; background: none !important; }
        .stage { position: relative; flex: 1; min-height: 0; }
        .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
        .loading { position: absolute; inset: 0; display: grid; place-items: center; color: #737373; font-size: 14px; pointer-events: none; }
        @media (max-width: 520px) { .bar .title, .bar .long { display: none; } .bar { justify-content: space-between; } }
    </style>
</head>
<body>
    <nav class="bar" aria-label="Navigazione">
        <a class="orfini-back-btn" href="../../index.html" title="Torna a Orfini Math Lab">← <span>Orfini Math Lab</span></a>

    <main class="stage">
        <div class="loading" id="loading">Caricamento di FuncLab AI…</div>
        <iframe
            src="https://funclab-ai-esploratore-di-funzioni.ai.studio/"
            title="FuncLab AI: Esploratore di Funzioni"
            allow="autoplay; fullscreen; clipboard-write"
            referrerpolicy="strict-origin-when-cross-origin"
            onload="document.getElementById('loading').remove()"></iframe>
    </main>
</body>
