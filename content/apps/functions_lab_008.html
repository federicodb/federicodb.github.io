<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <title>FuncLab AI: Esploratore di Funzioni</title>
    
    <link rel="stylesheet" href="../assets/style/orfini-shared.css">
    <script src="../assets/js/orfini-shared.js"></script>

    <meta name="description" content="Laboratorio interattivo di analisi matematica: piano cartesiano con zoom/pan, generatore di funzioni con AI, visualizzazione LaTeX, tratti analitici e Tutor Socratico con sintesi vocale.">
    <meta name="keywords" content="Matematica, Analisi, Funzioni, Studio di Funzione, Grafici, AI, Gemini, Tutor Socratico, Piano Cartesiano, Education, Laboratorio">
    <meta name="date" content="2026-09-09">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <style>
        /* Theme Configuration */
        :root {
            /* Dark Theme (Default - AMOLED) */
            --bg-app: #000000;
            --bg-panel: #121212;
            --border-color: #333333;
            --accent-primary: #6366f1; /* Indigo */
            --accent-secondary: #10b981; /* Emerald */
            --text-main: #ffffff;
            --text-muted: #a3a3a3;
            --grid-line: rgba(255, 255, 255, 0.1);
            --axis-line: #525252;
        }

        body.light {
            /* Light Theme */
            --bg-app: #f8fafc;
            --bg-panel: #ffffff;
            --border-color: #e2e8f0;
            --accent-primary: #4f46e5;
            --accent-secondary: #059669;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --grid-line: rgba(0, 0, 0, 0.05);
            --axis-line: #94a3b8;
        }

        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow: hidden;
            width: 100vw;
            height: 100dvh;
            margin: 0;
            padding: 0;
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-primary); }
        ::-webkit-scrollbar-track { background: transparent; }

        /* Typography */
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* High Contrast Selection */
        ::selection {
            background-color: var(--accent-primary);
            color: white;
        }

        /* No-scrollbar utility */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- FuncLab AI Application Module -->
    <script type="module" src="funclab_js/funclab_app.js"></script>
</body>
</html>
