    const _ikUnitX = new THREE.Vector3(1, 0, 0);
    const _ikDir = new THREE.Vector3();

    function solve2BoneIKInto(outVec, rootPos, targetPos, len1, len2, bendSign) {
      // IK a due segmenti in 3D: il piano di flessione contiene la direzione radice-bersaglio
      const dx = targetPos.x - rootPos.x;
      const dy = targetPos.y - rootPos.y;
      const dz = targetPos.z - rootPos.z;
      const distRaw = Math.hypot(dx, dy, dz);
      const maxReach = (len1 + len2) * 0.996;
      const minReach = Math.abs(len1 - len2) + 0.02;
      const dist = THREE.MathUtils.clamp(distRaw, minReach, maxReach);

      const cosAlpha = THREE.MathUtils.clamp(
        (len1 * len1 + dist * dist - len2 * len2) / (2 * len1 * dist),
        -1, 1
      );
      const alpha = Math.acos(cosAlpha);
      const inv = 1 / Math.max(1e-6, distRaw);
      const ux = dx * inv, uy = dy * inv, uz = dz * inv;
      // Direzione di flessione: perpendicolare a u nel piano verticale, verso indicato da bendSign
      let px = -uy * bendSign, py = ux * bendSign, pz = 0;
      const pd = px * ux + py * uy + pz * uz;
      px -= pd * ux; py -= pd * uy; pz -= pd * uz;
      const pl = 1 / Math.max(1e-6, Math.hypot(px, py, pz));
      const ca = Math.cos(alpha) * len1, sa = Math.sin(alpha) * len1 * pl;
      outVec.set(
        rootPos.x + ux * ca + px * sa,
        rootPos.y + uy * ca + py * sa,
        rootPos.z + uz * ca + pz * sa
      );
      return outVec;
    }

    function createLimbSegment(len, rTop, rBottom, mat = matMannequin) {
      const pts = [
        new THREE.Vector2(0.001, 0),
        new THREE.Vector2(rTop, len * 0.12),
        new THREE.Vector2((rTop + rBottom) * 0.54, len * 0.5),
        new THREE.Vector2(rBottom, len * 0.88),
        new THREE.Vector2(0.001, len)
      ];
      const geo = new THREE.LatheGeometry(pts, 8);
      geo.rotateZ(-Math.PI / 2);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      attachThickOutline(mesh, 20, thickInkSubject);
      return mesh;
    }

    function positionLimbBetween(mesh, pA, pB) {
      _ikDir.subVectors(pB, pA);
      const len = _ikDir.length();
      mesh.position.copy(pA);
      if (len > 1e-5) {
        mesh.quaternion.setFromUnitVectors(_ikUnitX, _ikDir.normalize());
      }
    }

    const UPPER_ARM_LEN = 0.42;
    const FOREARM_LEN = 0.50; // spalla-manopola misura 0,88 m in 3D
    const THIGH_LEN = 0.72;
    const SHIN_LEN = 0.70;

    // Vettori temporanei pre-allocati per la cinematica inversa (2.6)
    const _shoulderWorld = new THREE.Vector3();
    const _handTarget = new THREE.Vector3();
    const _elbowWorld = new THREE.Vector3();
    const _hipWorld = new THREE.Vector3();
    const _pedalTopTarget = new THREE.Vector3();
    const _kneeWorld = new THREE.Vector3();

    const limbs = [-1, 1].map((side) => {
      const shoulderJoint = createJointSphere(0.048);
      const elbowJoint = createJointSphere(0.038);
      const upperArm = createLimbSegment(UPPER_ARM_LEN, 0.046, 0.038);
      const forearm = createLimbSegment(FOREARM_LEN, 0.038, 0.030);
      const handMesh = new THREE.Mesh(new THREE.BoxGeometry(0.085, 0.048, 0.056), matPaper);
      handMesh.castShadow = true;
      attachThickOutline(handMesh, 20, thickInkSubject);

      const hipJoint = createJointSphere(0.054);
      const kneeJoint = createJointSphere(0.044);
      const ankleJoint = createJointSphere(0.034);
      const thigh = createLimbSegment(THIGH_LEN, 0.064, 0.048);
      const shin = createLimbSegment(SHIN_LEN, 0.048, 0.036);
      const footMesh = new THREE.Mesh(new THREE.BoxGeometry(0.17, 0.048, 0.075), matRimDark);
      footMesh.castShadow = true;
      attachThickOutline(footMesh, 20, thickInkSubject);

      riderGroup.add(
        shoulderJoint, elbowJoint, upperArm, forearm, handMesh,
        hipJoint, kneeJoint, ankleJoint, thigh, shin, footMesh
      );

      return {
        side,
        shoulderJoint, elbowJoint, upperArm, forearm, handMesh,
        hipJoint, kneeJoint, ankleJoint, thigh, shin, footMesh
      };
    });

    function updateMannequinKinematics(crankAngle, bobY, torsoPitch) {
      pelvisGroup.position.y = PELVIS_BASE_Y + bobY;
      torsoGroup.rotation.z = -0.34 + torsoPitch;
      headPivot.rotation.z = 0.28 - torsoPitch * 0.75;
      riderGroup.updateMatrixWorld(true);

      for (let i = 0; i < limbs.length; i++) {
        const L = limbs[i];
        const s = L.side;

        _shoulderWorld.set(0.02, 0.39, s * 0.195).applyMatrix4(torsoGroup.matrixWorld);
        bikeGroup.worldToLocal(_shoulderWorld);

        // Bersaglio mano allineato direttamente alle manopole del manubrio
        _handTarget.set(stemPos.x - 0.025, stemPos.y + 0.062, s * 0.32);
        solve2BoneIKInto(_elbowWorld, _shoulderWorld, _handTarget, UPPER_ARM_LEN, FOREARM_LEN, -1);

        L.shoulderJoint.position.copy(_shoulderWorld);
        L.elbowJoint.position.copy(_elbowWorld);
        positionLimbBetween(L.upperArm, _shoulderWorld, _elbowWorld);
        positionLimbBetween(L.forearm, _elbowWorld, _handTarget);
        L.handMesh.position.copy(_handTarget);
        L.handMesh.rotation.z = -0.22;
        _hipWorld.set(0.01, -0.05, s * 0.135).applyMatrix4(pelvisGroup.matrixWorld);
        bikeGroup.worldToLocal(_hipWorld);

        // 1. BUG: fase corretta a 90° affinché la caviglia coincida con il pedale su tutti i 360°
        const sidePhase = crankAngle + s * Math.PI / 2;
        _pedalTopTarget.set(
          bbPos.x + Math.cos(sidePhase) * CRANK_LEN + 0.015,
          bbPos.y + Math.sin(sidePhase) * CRANK_LEN + 0.048,
          s * PEDAL_Z
        );
        solve2BoneIKInto(_kneeWorld, _hipWorld, _pedalTopTarget, THIGH_LEN, SHIN_LEN, 1);

        L.hipJoint.position.copy(_hipWorld);
        L.kneeJoint.position.copy(_kneeWorld);
        L.ankleJoint.position.copy(_pedalTopTarget);
        positionLimbBetween(L.thigh, _hipWorld, _kneeWorld);
        positionLimbBetween(L.shin, _kneeWorld, _pedalTopTarget);

        L.footMesh.position.set(
          _pedalTopTarget.x + 0.032,
          _pedalTopTarget.y - 0.018,
          s * PEDAL_Z
        );
        L.footMesh.rotation.z = Math.sin(sidePhase) * 0.10;
      }
    }

    // =========================================================================
    // 9. ORIZZONTE A SAGOME, TERRENO E VEGETAZIONE
    // =========================================================================
    const landscapeGroup = new THREE.Group();
    scene.add(landscapeGroup);

    const CHUNK_LEN = 96;
    const CHUNK_WIDTH = 260;
    const TOTAL_BIOME_MODULES = 6;

    const infiniteGroundBase = new THREE.Mesh(new THREE.PlaneGeometry(540, 540), matTerrainFlat);
    infiniteGroundBase.rotation.x = -Math.PI / 2;
    infiniteGroundBase.position.y = TERRAIN_BED_Y - 0.15;
    infiniteGroundBase.receiveShadow = true;
    scene.add(infiniteGroundBase);

    // Tre catene di monti basse e piatte che ricevono la stessa nebbia del paesaggio:
    // la scala tonale resta continua dal primo piano all'orizzonte, e sole e luna restano in vista.
    const RIDGE_NEAR_R = 130;
    const matRidge = new THREE.MeshBasicMaterial({ color: PALETTE.vegMid, side: THREE.DoubleSide });
    const _baseRidgeColor = new THREE.Color(PALETTE.vegMid);
    function updateHorizonPalette(dayFactor) {
      // Non sono illuminati: il tono segue la luce del giorno, la nebbia fa il resto
      matRidge.color.copy(_baseRidgeColor).multiplyScalar(THREE.MathUtils.lerp(0.42, 1.0, dayFactor));
    }

    function createSilhouetteMountains(radius, baseHeight, ampA, ampB, phase) {
      const geo = new THREE.CylinderGeometry(radius, radius, 1, 128, 1, true);
      const pos = geo.attributes.position;
      const baseY = TERRAIN_BED_Y - 4.0;
      for (let i = 0; i < pos.count; i++) {
        if (pos.getY(i) > 0) {
          const ang = Math.atan2(pos.getZ(i), pos.getX(i));
          const ridge = (Math.sin(ang * 5.0 + phase) * 0.5 + 0.5) * ampA +
                        (Math.cos(ang * 11.0 - phase * 1.4) * 0.5 + 0.5) * ampB +
                        (Math.sin(ang * 23.0 + phase * 2.3) * 0.5 + 0.5) * ampB * 0.35;
          pos.setY(i, baseY + baseHeight + ridge);
        } else {
          pos.setY(i, baseY - 12.0);
        }
      }
      const mesh = new THREE.Mesh(geo, matRidge);
      mesh.matrixAutoUpdate = false;
      return mesh;
    }
    scene.add(createSilhouetteMountains(172, 11.0, 14.0, 7.5, 0.4));
    scene.add(createSilhouetteMountains(150, 8.0, 10.0, 5.5, 1.9));
    scene.add(createSilhouetteMountains(RIDGE_NEAR_R, 5.0, 7.0, 4.0, 3.3));

    function createSeededRng(seed) {
      let s = seed % 2147483647;
      if (s <= 0) s += 2147483646;
      return function () {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    function hash2D(ix, iz) {
      const n = Math.sin(ix * 127.1 + iz * 311.7) * 43758.5453123;
      return n - Math.floor(n);
    }

    function valueNoise2D(x, z) {
      const ix = Math.floor(x);
      const iz = Math.floor(z);
      const fx = x - ix;
      const fz = z - iz;
      const ux = fx * fx * (3 - 2 * fx);
      const uz = fz * fz * (3 - 2 * fz);
      const a = hash2D(ix, iz);
      const b = hash2D(ix + 1, iz);
      const c = hash2D(ix, iz + 1);
      const d = hash2D(ix + 1, iz + 1);
      return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
    }

    function fbm2D(x, z) {
      return (
        0.55 * valueNoise2D(x, z) +
        0.30 * valueNoise2D(x * 2.07 + 13.1, z * 2.07 + 7.4) +
        0.15 * valueNoise2D(x * 4.13 + 29.3, z * 4.13 + 19.8)
      );
    }

    function ridgedNoise2D(x, z) {
      const v1 = 1.0 - Math.abs(valueNoise2D(x, z) * 2.0 - 1.0);
      const v2 = 1.0 - Math.abs(valueNoise2D(x * 2.1 + 5.3, z * 2.1 - 3.9) * 2.0 - 1.0);
      return v1 * v1 * 0.68 + v2 * v2 * 0.32;
    }

    function getBiomeTerrainHeight(biomeIndex, lx, lz) {
      const roadBedY = TERRAIN_BED_Y;
      const absZ = Math.abs(lz);
      // Lato camera (+z): prato aperto fino a 10 m, cosi' la vista resta libera; lato opposto: rilievo che sale dolcemente
      const roadClearance = lz > 0
        ? THREE.MathUtils.smoothstep(lz, 24.0, 70.0)
        : THREE.MathUtils.smoothstep(absZ, 2.2, 30.0);

      const distFromEdgeX = Math.max(0, CHUNK_LEN * 0.5 - Math.abs(lx));
      const edgeBlend = 1.0 - THREE.MathUtils.smoothstep(distFromEdgeX, 0.0, 14.0);

      let relief = 0;
      if (biomeIndex === 0) {
        const gentle = (fbm2D(lx * 0.015 + 1.2, lz * 0.015 - 0.8) - 0.48) * 3.8;
        const outerRise = THREE.MathUtils.smoothstep(absZ, 34, 128) * 8.5;
        relief = Math.max(-0.15, gentle) + outerRise;
      } else if (biomeIndex === 1) {
        const hills = (fbm2D(lx * 0.022 + 4.3, lz * 0.022 + 2.1) - 0.42) * 14.0;
        const knolls = (fbm2D(lx * 0.055 - 2.1, lz * 0.055 + 6.4) - 0.5) * 3.4;
        const outerRise = THREE.MathUtils.smoothstep(absZ, 26, 128) * 16.0;
        relief = Math.max(-0.25, hills) + knolls + outerRise;
      } else if (biomeIndex === 2) {
        const valley = (fbm2D(lx * 0.020 + 8.1, lz * 0.022 - 3.7) - 0.40) * 19.0;
        const detail = (fbm2D(lx * 0.060 - 4.4, lz * 0.060 + 5.2) - 0.5) * 4.5;
        const outerRise = THREE.MathUtils.smoothstep(absZ, 22, 128) * 21.0;
        relief = Math.max(-0.30, valley) + detail + outerRise;
      } else if (biomeIndex === 3) {
        const peaks = ridgedNoise2D(lx * 0.018 + 2.7, lz * 0.019 - 5.1) * 30.0;
        const crags = (fbm2D(lx * 0.065 + 1.9, lz * 0.065 + 3.3) - 0.45) * 6.0;
        const sideWall = THREE.MathUtils.smoothstep(absZ, 14, 126) * 28.0;
        relief = Math.max(0, peaks - 4.0) + crags + sideWall;
      } else if (biomeIndex === 4) {
        const duneWave = Math.sin(lx * 0.085 + lz * 0.055 + fbm2D(lx * 0.025, lz * 0.025) * 4.2);
        const duneCrest = (1.0 - Math.abs(duneWave)) * 6.5;
        const macroDune = (fbm2D(lx * 0.016 - 6.3, lz * 0.018 + 4.9) - 0.35) * 11.5;
        const outerMesa = THREE.MathUtils.smoothstep(absZ, 34, 128) * 13.0;
        relief = Math.max(0, macroDune) + duneCrest + outerMesa;
      } else {
        const mesa = (fbm2D(lx * 0.019 - 9.2, lz * 0.020 - 4.1) - 0.46) * 9.0;
        const outerRise = THREE.MathUtils.smoothstep(absZ, 30, 128) * 11.0;
        relief = Math.max(-0.20, mesa) + outerRise;
      }

      const transitionRelief = THREE.MathUtils.smoothstep(absZ, 28, 128) * 10.0;
      // Tetto morbido a 12 m: il rilievo non copre mai cielo, sole e sagome dell'orizzonte
      const blendedRelief = 12.0 * Math.tanh(THREE.MathUtils.lerp(relief, transitionRelief, edgeBlend) / 12.0);
      return roadBedY + roadClearance * blendedRelief;
    }

    function mergeBufferGeometriesSimple(geos) {
      let totalVerts = 0;
      let totalIndices = 0;
      for (const g of geos) {
        totalVerts += g.attributes.position.count;
        totalIndices += g.index ? g.index.count : g.attributes.position.count;
      }
      const posArr = new Float32Array(totalVerts * 3);
      const normArr = new Float32Array(totalVerts * 3);
      const idxArr = new Uint32Array(totalIndices);

      let vOffset = 0;
      let iOffset = 0;
      for (const g of geos) {
        const p = g.attributes.position.array;
        const n = g.attributes.normal.array;
        posArr.set(p, vOffset * 3);
        normArr.set(n, vOffset * 3);

        if (g.index) {
          const idx = g.index.array;
          for (let i = 0; i < idx.length; i++) idxArr[iOffset + i] = idx[i] + vOffset;
          iOffset += idx.length;
        } else {
          const count = g.attributes.position.count;
          for (let i = 0; i < count; i++) idxArr[iOffset + i] = i + vOffset;
          iOffset += count;
        }
        vOffset += g.attributes.position.count;
      }
      const merged = new THREE.BufferGeometry();
      merged.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
      merged.setAttribute('normal', new THREE.BufferAttribute(normArr, 3));
      // Indice solo se serve: per vertici gia' non indicizzati sarebbe un elenco 0..n inutile
      if (geos.some((g) => g.index)) merged.setIndex(new THREE.BufferAttribute(idxArr, 1));
      return merged;
    }

    function pushTransformedGeometry(targetList, sourceGeo, matrix) {
      const g = sourceGeo.index ? sourceGeo.toNonIndexed() : sourceGeo.clone();
      g.applyMatrix4(matrix);
      g.computeVertexNormals();
      targetList.push(g);
    }

    const primCone7 = new THREE.ConeGeometry(1, 1, 7);
    const primCone6 = new THREE.ConeGeometry(1, 1, 6);
    const primIco1 = new THREE.IcosahedronGeometry(1, 1);
    const primIco0 = new THREE.IcosahedronGeometry(1, 0);
    const primCyl6 = new THREE.CylinderGeometry(0.68, 1.0, 1, 6);
    const primCyl7 = new THREE.CylinderGeometry(0.85, 1.0, 1, 7);
    const primBox = new THREE.BoxGeometry(1, 1, 1);

    // 2.5 Generatore incrementale dei biomi a budget di tempo (~8 ms per frame)
    function createBiomeBuilder(biomeIndex, seed) {
      const rng = createSeededRng(seed);
      const group = new THREE.Group();
      group.userData.biomeIndex = biomeIndex;

      // Terreno in 16 tessere (4 in x per 4 fasce in z): il motore scarta quelle fuori campo,
      // e quelle oltre la nebbia vengono spente a ogni frame
      const halfW = CHUNK_WIDTH * 0.5;
      const TX = 4;
      const mapZ = (vzRaw) => {
        const t = vzRaw / halfW;
        const a = Math.abs(t);
        return Math.sign(t) * (0.08 * a + 0.92 * Math.pow(a, 2.35)) * halfW; // fitto vicino alla strada, rado lontano
      };
      const Z_SPLIT = mapZ(halfW * 0.5);
      const tileOf = (x, z) => {
        const ix = THREE.MathUtils.clamp(Math.floor((x / CHUNK_LEN + 0.5) * TX), 0, TX - 1);
        const iz = z < -Z_SPLIT ? 0 : z < 0 ? 1 : z < Z_SPLIT ? 2 : 3;
        return iz * TX + ix;
      };
      const tiles = [];
      group.userData.tiles = tiles;
      for (let iz = 0; iz < 4; iz++) {
        for (let ix = 0; ix < TX; ix++) {
          const geo = new THREE.PlaneGeometry(CHUNK_LEN / TX, halfW * 0.5, 8, 22);
          geo.rotateX(-Math.PI / 2);
          geo.translate(-CHUNK_LEN * 0.5 + (ix + 0.5) * (CHUNK_LEN / TX), 0, (-0.75 + iz * 0.5) * halfW);
          const pos = geo.attributes.position;
          const toneArr = new Float32Array(pos.count * 3);
          for (let i = 0; i < pos.count; i++) {
            const vx = pos.getX(i);
            const vz = mapZ(pos.getZ(i));
            pos.setZ(i, vz);
            pos.setY(i, getBiomeTerrainHeight(biomeIndex, vx, vz));
            // Leggera variazione di tono, come una carta non uniforme (raccordata ai bordi del modulo)
            const edge = THREE.MathUtils.smoothstep(CHUNK_LEN * 0.5 - Math.abs(vx), 0.0, 12.0);
            const tone = THREE.MathUtils.lerp(0.99, 0.92 + 0.14 * fbm2D(vx * 0.05 + biomeIndex * 7.3, vz * 0.05), edge);
            toneArr[i * 3] = toneArr[i * 3 + 1] = toneArr[i * 3 + 2] = tone;
          }
          geo.setAttribute('color', new THREE.BufferAttribute(toneArr, 3));
          geo.deleteAttribute('uv');
          geo.computeVertexNormals();
          geo.computeBoundingSphere();

          const tile = new THREE.Group();
          const terrainMesh = new THREE.Mesh(geo, matTerrain);
          terrainMesh.receiveShadow = true;
          terrainMesh.matrixAutoUpdate = false;
          tile.add(terrainMesh);
          tile.userData.cx = geo.boundingSphere.center.x;
          tile.userData.cz = geo.boundingSphere.center.z;
          tile.userData.r = geo.boundingSphere.radius + 14.0; // margine per le chiome degli alberi
          group.add(tile);
          tiles.push(tile);
        }
      }

      const darkGeos = [];
      const midGeos = [];
      const lightGeos = [];
      const dummy = new THREE.Object3D();

      function addPart(list, prim, px, py, pz, sx, sy, sz, rx = 0, ry = 0, rz = 0) {
        dummy.position.set(px, py, pz);
        dummy.scale.set(sx, sy, sz);
        dummy.rotation.set(rx, ry, rz);
        dummy.updateMatrix();
        pushTransformedGeometry(list, prim, dummy.matrix);
        list[list.length - 1].userData.tile = tileOf(px, pz);
      }

      const targetObjectsByBiome = [230, 320, 400, 310, 190, 220];
      const targetObjects = targetObjectsByBiome[biomeIndex] || 420;
      let placed = 0;
      let attempts = 0;
      let finalized = false;

      // Ciuffi d'erba in primo piano: danno scala e senso di velocita'
      for (let i = 0; i < 170; i++) {
        const tx = (rng() - 0.5) * (CHUNK_LEN - 1.0);
        const tz = (rng() < 0.5 ? -1 : 1) * (1.75 + Math.pow(rng(), 1.5) * 8.5);
        const th = 0.07 + rng() * 0.16;
        const ty = getBiomeTerrainHeight(biomeIndex, tx, tz);
        addPart(rng() < 0.6 ? lightGeos : midGeos, primCone6, tx, ty + th * 0.5, tz, th * 0.5, th, th * 0.5, 0, rng() * 6.28, (rng() - 0.5) * 0.3);
      }

      return {
        step(budgetMs = 7.5) {
          const t0 = performance.now();
          while (placed < targetObjects && attempts < 3600) {
            if (performance.now() - t0 >= budgetMs) return false;
            attempts++;
            const lx = (rng() - 0.5) * (CHUNK_LEN - 3.0);
            const sideSign = rng() < 0.5 ? 1 : -1;
            const zNorm = Math.pow(rng(), 0.7);
            const lz = sideSign > 0 ? 18.0 + zNorm * 100.0 : -(14.0 + zNorm * 104.0);

            const groundY = getBiomeTerrainHeight(biomeIndex, lx, lz) - 0.03;
            // Corridoio libero dietro la strada: gli alberi partono a 14 m e crescono allontanandosi
            const s = (0.62 + rng() * 0.6) * THREE.MathUtils.lerp(0.45, 1.0, THREE.MathUtils.smoothstep(Math.abs(lz), 14.0, 36.0));
            const rotY = rng() * Math.PI * 2;
            const rType = rng();

            if (biomeIndex === 4) {
              if (rType < 0.44) {
                const h = (3.4 + rng() * 2.8) * s;
                const r = 0.24 * s;
                addPart(midGeos, primCyl7, lx, groundY + h * 0.5, lz, r, h, r, 0, rotY, 0);
                addPart(midGeos, primIco1, lx, groundY + h, lz, r * 0.92, r * 0.92, r * 0.92, 0, rotY, 0);
                const armDir = Math.cos(rotY);
                const armZ = Math.sin(rotY);
                const armH1 = h * 0.48;
                addPart(midGeos, primCyl7, lx + armDir * r * 1.6, groundY + armH1, lz + armZ * r * 1.6, r * 0.75, r * 2.2, r * 0.75, 0, rotY, Math.PI * 0.48);
                addPart(midGeos, primCyl7, lx + armDir * r * 2.5, groundY + armH1 + h * 0.18, lz + armZ * r * 2.5, r * 0.72, h * 0.34, r * 0.72, 0, rotY, 0);
              } else if (rType < 0.82) {
                const rx = (1.1 + rng() * 1.4) * s;
                const ry = (0.55 + rng() * 0.7) * s;
                addPart(lightGeos, primIco0, lx, groundY + ry * 0.35, lz, rx, ry, rx * 0.82, rng() * 0.4, rotY, rng() * 0.3);
              } else {
                const bh = (0.75 + rng() * 0.55) * s;
                addPart(darkGeos, primIco0, lx, groundY + bh * 0.35, lz, bh * 1.1, bh * 0.75, bh, 0, rotY, 0);
              }
            } else if (biomeIndex === 3) {
              if (rType < 0.52) {
                const totalH = (8.0 + rng() * 5.2) * s;
                const trunkH = totalH * 0.24;
                addPart(darkGeos, primCyl6, lx, groundY + trunkH * 0.5, lz, 0.24 * s, trunkH, 0.24 * s, 0, rotY, 0);
                const tiers = 5;
                for (let t = 0; t < tiers; t++) {
                  const frac = t / (tiers - 1);
                  const tierR = (2.15 * (1 - frac * 0.66) + 0.32) * s;
                  const tierH = (totalH * 0.34) * (1 - frac * 0.24);
                  const tierY = groundY + trunkH * 0.75 + frac * (totalH * 0.66) + tierH * 0.4;
                  const target = t % 2 === 0 ? darkGeos : midGeos;
                  addPart(target, primCone7, lx, tierY, lz, tierR, tierH, tierR, (rng() - 0.5) * 0.08, rotY + t * 0.7, (rng() - 0.5) * 0.08);
                }
              } else if (rType < 0.96) {
                const rx = (1.2 + rng() * 1.6) * s;
                const ry = (0.7 + rng() * 0.9) * s;
                addPart(midGeos, primIco0, lx, groundY + ry * 0.38, lz, rx, ry, rx * 0.85, rng() * 0.5, rotY, rng() * 0.4);
              } else {
                const bw = 3.2 * s;
                const bh = 2.0 * s;
                const bd = 2.6 * s;
                addPart(lightGeos, primBox, lx, groundY + bh * 0.5, lz, bw, bh, bd, 0, rotY, 0);
                addPart(darkGeos, primCone6, lx, groundY + bh + bh * 0.45, lz, bw * 0.82, bh * 0.95, bd * 0.82, 0, rotY + Math.PI / 4, 0);
              }
            } else {
              const deciduousRatio = biomeIndex === 2 ? 0.42 : 0.56;
              if (rType < deciduousRatio) {
                const totalH = (7.2 + rng() * 4.5) * s;
                const trunkH = totalH * 0.46;
                const trunkR = 0.24 * s;
                addPart(darkGeos, primCyl6, lx, groundY + trunkH * 0.5, lz, trunkR, trunkH, trunkR, 0, rotY, 0);
                const crownBaseY = groundY + trunkH * 0.88;
                const mainR = (1.85 + rng() * 0.65) * s;
                const mainLeaf = rng() < 0.5 ? lightGeos : midGeos;
                addPart(mainLeaf, primIco1, lx, crownBaseY + mainR * 0.75, lz, mainR * 1.15, mainR * 0.95, mainR * 1.05, 0.2, rotY, 0.15);
                const subR = mainR * 0.72;
                const bx = Math.cos(rotY) * mainR * 0.62;
                const bz = Math.sin(rotY) * mainR * 0.62;
                addPart(midGeos, primIco1, lx + bx, crownBaseY + mainR * 0.92, lz + bz, subR, subR * 0.9, subR, -0.2, rotY + 1.1, 0.2);
              } else if (rType < 0.82) {
                const totalH = (7.6 + rng() * 4.8) * s;
                const trunkH = totalH * 0.24;
                addPart(darkGeos, primCyl6, lx, groundY + trunkH * 0.5, lz, 0.23 * s, trunkH, 0.23 * s, 0, rotY, 0);
                const tiers = 4;
                for (let t = 0; t < tiers; t++) {
                  const frac = t / (tiers - 1);
                  const tierR = (2.1 * (1 - frac * 0.62) + 0.35) * s;
                  const tierH = (totalH * 0.36) * (1 - frac * 0.22);
                  const tierY = groundY + trunkH * 0.78 + frac * (totalH * 0.62) + tierH * 0.4;
                  addPart(t % 2 === 0 ? midGeos : darkGeos, primCone7, lx, tierY, lz, tierR, tierH, tierR, 0, rotY + t * 0.65, 0);
                }
              } else if (rType < 0.94) {
                const rx = (0.85 + rng() * 1.15) * s;
                const ry = (0.45 + rng() * 0.55) * s;
                addPart(midGeos, primIco0, lx, groundY + ry * 0.35, lz, rx, ry, rx * 0.8, rng() * 0.5, rotY, rng() * 0.3);
              } else {
                const stumpH = 0.82 * s;
                addPart(darkGeos, primCyl6, lx, groundY + stumpH * 0.5, lz, 0.30 * s, stumpH, 0.30 * s, 0, rotY, 0);
                addPart(lightGeos, primIco0, lx + 0.75 * s, groundY + 0.45 * s, lz + 0.45 * s, 0.85 * s, 0.65 * s, 0.85 * s, 0.3, rotY, 0.2);
              }
            }
            placed++;
          }

          if (!finalized) {
            finalized = true;
            // Una mesh per materiale e per tessera
            [[darkGeos, matVegDark], [midGeos, matVegMid], [lightGeos, matVegLight]].forEach(([list, mat]) => {
              const byTile = new Map();
              for (const g of list) {
                const k = g.userData.tile;
                if (!byTile.has(k)) byTile.set(k, []);
                byTile.get(k).push(g);
              }
              byTile.forEach((geos, k) => {
                const mesh = new THREE.Mesh(mergeBufferGeometriesSimple(geos), mat);
                mesh.receiveShadow = true;
                mesh.matrixAutoUpdate = false;
                mesh.geometry.computeBoundingSphere();
                tiles[k].add(mesh);
              });
              list.forEach((g) => g.dispose());
            });
          }
          return true;
        },
        group
      };
    }

    const landscapeChunks = [];

    // =========================================================================
    // 10. PRECARICAMENTO A BUDGET DI TEMPO & WARM-UP GPU
    // =========================================================================
    const introScreen = document.getElementById('intro-screen');
    const introLoaderBox = document.getElementById('intro-loader-box');
    const introProgressBar = document.getElementById('intro-progress-bar');
    const introProgressText = document.getElementById('intro-progress-text');
    const btnStartSim = document.getElementById('btn-start-sim');
    const bottomDock = document.getElementById('bottom-dock');
    const topBar = document.getElementById('top-bar');
    const hintToast = document.getElementById('hint-toast');

    function setPreloadProgress(pct, label) {
      const clamped = Math.min(100, Math.max(0, Math.round(pct)));
      introProgressBar.style.width = clamped + '%';
      introProgressText.textContent = label + ' · ' + clamped + '%';
    }

    function runIncrementalPreload() {
      const biomeNames = ['Pianura', 'Colline', 'Foresta', 'Montagne', 'Deserto', 'Altopiano'];
      let biomeIdx = 0;
      let currentBiomeBuilder = null;
      let polyCursor = 3;
      let compiled = false;

      setPolygonSides(4, false);
      updateSimulationFrame(0);
      setPreloadProgress(8, 'Calibrazione cinematica');

      function nextPreloadStep() {
        const frameStart = performance.now();

        if (biomeIdx < TOTAL_BIOME_MODULES) {
          if (!currentBiomeBuilder) {
            currentBiomeBuilder = createBiomeBuilder(biomeIdx, 104729 + biomeIdx * 7919);
          } else if (currentBiomeBuilder.step(7.5)) {
            const mod = currentBiomeBuilder.group;
            mod.visible = false;
            landscapeGroup.add(mod);
            landscapeChunks.push(mod);
            currentBiomeBuilder = null;
            biomeIdx++;
          }
          setPreloadProgress(8 + (biomeIdx / TOTAL_BIOME_MODULES) * 56, 'Bioma ' + biomeNames[Math.min(biomeIdx, TOTAL_BIOME_MODULES - 1)]);
          requestAnimationFrame(nextPreloadStep);
          return;
        }

        if (polyCursor <= 36) {
          while (polyCursor <= 36 && performance.now() - frameStart < 7.5) {
            ensurePolygonCached(polyCursor);
            polyCursor++;
          }
          setPreloadProgress(64 + ((polyCursor - 3) / 34) * 34, 'Archi di catenaria n = ' + Math.min(36, polyCursor));
          requestAnimationFrame(nextPreloadStep);
          return;
        }

        if (!compiled) {
          compiled = true;
          updateSimulationFrame(0);
          renderer.compile(scene, camera);
          renderer.render(scene, camera);
          state.simReady = true;
          state.needsRender = true;
          setPreloadProgress(100, 'Pronto');

          introLoaderBox.style.opacity = '0';
          setTimeout(() => {
            introLoaderBox.style.display = 'none';
            btnStartSim.disabled = false;
            btnStartSim.classList.remove('is-loading');
            btnStartSim.focus({ preventScroll: true });
          }, 180);
        }
      }
      requestAnimationFrame(nextPreloadStep);
    }

    // =========================================================================
    // 11. INTERFACCIA: LATI, VISTE, LUCE, TOUR, SCHERMO INTERO, TASTIERA
    // =========================================================================
    const btnPlayPause = document.getElementById('btn-play-pause');
    const iconPause = document.getElementById('icon-pause');
    const iconPlay = document.getElementById('icon-play');
    const sliderSides = document.getElementById('slider-sides');
    const labelSides = document.getElementById('label-sides');
    const miniPolyShape = document.getElementById('mini-poly-shape');
    const btnProfileView = document.getElementById('btn-profile-view');
    const btnTour = document.getElementById('btn-tour');
    const btnLight = document.getElementById('btn-light');
    const labelLight = document.getElementById('label-light');
    const btnGeo = document.getElementById('btn-geo');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    const readoutEl = document.getElementById('readout');

    const POLYGON_NAMES_IT = {
      3: 'triangolo', 4: 'quadrato', 5: 'pentagono', 6: 'esagono', 7: 'ettagono', 8: 'ottagono',
      9: 'ennagono', 10: 'decagono', 11: 'endecagono', 12: 'dodecagono'
    };
    const fmtIt = (v, d = 2) => v.toFixed(d).replace('.', ',');

    function getPolygonNameItalian(n) {
      return POLYGON_NAMES_IT[n] ? `${POLYGON_NAMES_IT[n]} (${n})` : `${n} lati`;
    }

    function updatePolygonBadgeUI(n) {
      const text = getPolygonNameItalian(n);
      labelSides.textContent = text;
      sliderSides.setAttribute('aria-valuenow', String(n));
      sliderSides.setAttribute('aria-valuetext', text);
      sliderSides.style.setProperty('--fill-pct', (((n - 3) / 33) * 100).toFixed(2) + '%');

      const pts = [];
      const phase = -Math.PI / 2 - Math.PI / n;
      for (let i = 0; i < n; i++) {
        const a = phase + (i / n) * Math.PI * 2;
        pts.push((Math.cos(a) * 7.6).toFixed(2) + ',' + (Math.sin(a) * 7.6).toFixed(2));
      }
      miniPolyShape.setAttribute('points', pts.join(' '));

      const c = CAT[n];
      readoutEl.innerHTML =
        `n = <b>${n}</b> · arco <b>${fmtIt(c.W)} m</b>` +
        `<span class="readout-extra"> · y = R − a·cosh(x/a), a = ${fmtIt(c.a)} m</span>` +
        `<br><span class="readout-extra">quota del mozzo: ${fmtIt(FIXED_R)} m, costante` +
        (n === 3 ? ' · con 3 lati il vertice successivo taglia l\u2019arco seguente' : '') + `</span>`;
    }
    updatePolygonBadgeUI(4);

    // Velocità: scala logaritmica 0,1× – 3×, con aggancio a 1×
    const sliderSpeed = document.getElementById('slider-speed');
    const speedValue = document.getElementById('speed-value');
    const SPEED_MIN = 0.1;
    const SPEED_MAX = 3.0;
    const speedFromSlider = (v) => SPEED_MIN * Math.pow(SPEED_MAX / SPEED_MIN, v / 100);
    const sliderFromSpeed = (m) => (Math.log(m / SPEED_MIN) / Math.log(SPEED_MAX / SPEED_MIN)) * 100;

    function setSpeed(mul) {
      mul = THREE.MathUtils.clamp(mul, SPEED_MIN, SPEED_MAX);
      if (Math.abs(mul - 1) < 0.045) mul = 1;
      state.speedMul = mul;
      const v = sliderFromSpeed(mul);
      sliderSpeed.value = String(Math.round(v));
      sliderSpeed.style.setProperty('--fill-pct', v.toFixed(2) + '%');
      const text = fmtIt(mul, mul < 1 ? 2 : 1) + '×';
      speedValue.textContent = text;
      sliderSpeed.setAttribute('aria-valuetext', text);
      speedValue.classList.toggle('is-default', mul === 1);
    }
    setSpeed(1);

    function applySides(n) {
      n = THREE.MathUtils.clamp(n, 3, 36);
      if (n === state.targetSides) return;
      state.targetSides = n;
      sliderSides.value = String(n);
      updatePolygonBadgeUI(n);
      setPolygonSides(n, true);
    }

    // Su schermi stretti o verticali la camera arretra finché la bici entra tutta nel quadro
    const _fitPos = new THREE.Vector3();
    function fittedViewPos(view) {
      const baseDist = view.pos.distanceTo(view.target);
      const k = Math.min(THREE.MathUtils.clamp(1.45 / camera.aspect, 1.0, 2.8), controls.maxDistance / baseDist);
      return _fitPos.copy(view.pos).sub(view.target).multiplyScalar(k).add(view.target);
    }

    function startCameraTransition(view, duration = 0.9) {
      if (prefersReducedMotion || duration <= 0) {
        camera.position.copy(fittedViewPos(view));
        controls.target.copy(view.target);
        camera.fov = view.fov;
        camera.updateProjectionMatrix();
        updateHullScale();
        controls.update();
        state.cameraAnim = null;
        state.needsRender = true;
        return;
      }
      state.cameraAnim = {
        fromPos: camera.position.clone(),
        toPos: fittedViewPos(view).clone(),
        fromTarget: controls.target.clone(),
        toTarget: view.target,
        fromFov: camera.fov,
        toFov: view.fov,
        elapsed: 0,
        duration
      };
      state.needsRender = true;
    }

    function setView(name, duration = 0.9) {
      state.profileView = name === 'profile';
      state.viewPristine = true;
      btnProfileView.classList.toggle('active', state.profileView);
      btnProfileView.setAttribute('aria-pressed', String(state.profileView));
      startCameraTransition(VIEWS[name], duration);
    }

    function togglePlayPause() {
      state.isPlaying = !state.isPlaying;
      btnPlayPause.setAttribute('aria-pressed', String(!state.isPlaying));
      iconPause.classList.toggle('hidden', !state.isPlaying);
      iconPlay.classList.toggle('hidden', state.isPlaying);
      if (!state.isPlaying) stopTour();
      state.needsRender = true;
    }

    function setLightMode(mode) {
      state.lightMode = mode;
      if (mode !== 'auto') {
        let delta = LIGHT_PRESETS[mode] - state.solarTime;
        delta -= Math.round(delta);
        state.lightAnim = { from: state.solarTime, delta, t: prefersReducedMotion ? 1.0 : 0.0, dur: 1.2 + 7.0 * Math.abs(delta) };
        if (prefersReducedMotion) state.solarTime = LIGHT_PRESETS[mode];
      } else {
        state.lightAnim = null;
      }
      labelLight.textContent = 'Luce: ' + mode;
      btnLight.classList.toggle('active', mode !== 'auto');
      state.needsRender = true;
    }

    function setGeometryVisible(v) {
      state.showGeometry = v;
      geoGroup.visible = v;
      trackMarker.visible = v;
      btnGeo.classList.toggle('active', v);
      btnGeo.setAttribute('aria-pressed', String(v));
      state.needsRender = true;
    }

    // Tour automatico: dal triangolo al quasi-cerchio alternando le due viste
    const TOUR_STEPS = [
      { n: 3, view: 'quarter' }, { n: 4 }, { n: 5 }, { n: 6, view: 'profile' }, { n: 8 },
      { n: 12, view: 'quarter' }, { n: 20 }, { n: 36, view: 'profile' }, { n: 4, view: 'quarter' }
    ];
    const TOUR_STEP_SECONDS = 3.6;

    function startTour() {
      if (!state.isPlaying) togglePlayPause();
      state.tour = { idx: -1, t: TOUR_STEP_SECONDS };
      btnTour.classList.add('active');
      btnTour.setAttribute('aria-pressed', 'true');
    }
    function stopTour() {
      if (!state.tour) return;
      state.tour = null;
      btnTour.classList.remove('active');
      btnTour.setAttribute('aria-pressed', 'false');
    }
    function updateTour(dt) {
      const tour = state.tour;
      if (!tour) return;
      tour.t += dt;
      if (tour.t < TOUR_STEP_SECONDS) return;
      tour.t = 0;
      tour.idx = (tour.idx + 1) % TOUR_STEPS.length;
      const stepDef = TOUR_STEPS[tour.idx];
      applySides(stepDef.n);
      if (stepDef.view) setView(stepDef.view, 1.4);
    }

    function hideHint() {
      hintToast.classList.add('hint-hidden');
    }

    function toggleFullscreen() {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }

    btnStartSim.addEventListener('click', () => {
      if (!state.simReady || state.introDismissed) return;
      state.introDismissed = true;
      window.__INTRO_STOPPED__ = true;
      introScreen.classList.add('hidden-intro');
      bottomDock.classList.remove('dock-hidden');
      topBar.classList.remove('ui-hidden');
      btnStartSim.blur();
      setView('quarter', 2.2);
      setTimeout(() => hintToast.classList.remove('hint-hidden'), 2400);
      setTimeout(hideHint, 10500);
    });

    btnPlayPause.addEventListener('click', togglePlayPause);
    btnProfileView.addEventListener('click', () => { stopTour(); setView(state.profileView ? 'quarter' : 'profile'); });
    btnTour.addEventListener('click', () => { if (state.tour) stopTour(); else startTour(); });
    btnLight.addEventListener('click', () => {
      setLightMode(LIGHT_MODES[(LIGHT_MODES.indexOf(state.lightMode) + 1) % LIGHT_MODES.length]);
    });
    btnGeo.addEventListener('click', () => setGeometryVisible(!state.showGeometry));
    btnFullscreen.addEventListener('click', toggleFullscreen);

    sliderSpeed.addEventListener('input', (e) => setSpeed(speedFromSlider(parseFloat(e.target.value))));
    sliderSpeed.addEventListener('dblclick', () => setSpeed(1));
    speedValue.addEventListener('click', () => setSpeed(1));

    sliderSides.addEventListener('input', (e) => {
      const n = parseInt(e.target.value, 10);
      if (Number.isNaN(n)) return;
      stopTour();
      applySides(n);
    });

    // Un gesto sull'area 3D interrompe tour e animazioni di camera: comanda sempre chi guarda
    controls.addEventListener('start', () => {
      state.cameraAnim = null;
      state.viewPristine = false;
      stopTour();
      hideHint();
    });
    controls.addEventListener('change', () => { state.needsRender = true; });

    window.addEventListener('keydown', (e) => {
      if (!state.introDismissed || e.metaKey || e.ctrlKey || e.altKey) return;
      const onButton = document.activeElement && document.activeElement.tagName === 'BUTTON';
      switch (e.code) {
        case 'Space':
          if (onButton) return;
          e.preventDefault();
          togglePlayPause();
          break;
        case 'ArrowRight': case 'ArrowUp':
          if (document.activeElement === sliderSides) return;
          e.preventDefault(); stopTour(); applySides(state.targetSides + 1);
          break;
        case 'ArrowLeft': case 'ArrowDown':
          if (document.activeElement === sliderSides) return;
          e.preventDefault(); stopTour(); applySides(state.targetSides - 1);
          break;
        case 'KeyP': stopTour(); setView(state.profileView ? 'quarter' : 'profile'); break;
        case 'KeyT': if (state.tour) stopTour(); else startTour(); break;
        case 'KeyL': btnLight.click(); break;
        case 'KeyG': setGeometryVisible(!state.showGeometry); break;
        case 'KeyF': toggleFullscreen(); break;
        case 'Equal': case 'NumpadAdd': setSpeed(state.speedMul * 1.25); break;
        case 'Minus': case 'NumpadSubtract': setSpeed(state.speedMul / 1.25); break;
        case 'Digit0': case 'Numpad0': setSpeed(1); break;
        default: return;
      }
      hideHint();
    });

    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(QUALITY.tier >= 1 ? 1 : fullPixelRatio()); // anche quando la finestra cambia monitor
      renderer.setSize(w, h);
      for (let i = 0; i < lineMaterials.length; i++) lineMaterials[i].resolution.set(w, h);
      updateHullScale();
      if (state.introDismissed && state.viewPristine) setView(state.profileView ? 'profile' : 'quarter', 0);
      state.needsRender = true;
    });

    // =========================================================================
    // 12. LOOP: SIMULAZIONE, CAMERA, RENDERING SOLO QUANDO SERVE
    // =========================================================================
    function updateSimulationFrame(dt) {
      if (state.isPlaying) state.distanceX += FIXED_SPEED * state.speedMul * dt;

      if (state.sidesTransitionT < 1.0) {
        state.sidesTransitionT = Math.min(1.0, state.sidesTransitionT + dt / 0.32);
        applySidesTransition();
      }

      const n = state.sides;
      const W = CAT[n].W;
      roadGroup.position.x = -(((state.distanceX % W) + W) % W);

      // Paesaggio: visibile solo il modulo il cui bordo più vicino è entro 140 m
      if (landscapeChunks.length > 0) {
        const count = landscapeChunks.length;
        const centerSlot = Math.round(state.distanceX / CHUNK_LEN);
        for (let i = 0; i < count; i++) landscapeChunks[i].visible = false;
        for (let offset = -2; offset <= 2; offset++) {
          const worldSlot = centerSlot + offset;
          const relCenterX = worldSlot * CHUNK_LEN - state.distanceX;
          if (Math.abs(relCenterX) - CHUNK_LEN * 0.5 <= 200.0) { // tutti e cinque i moduli: i nuovi entrano a 192 m, oltre la nebbia
            const chunk = landscapeChunks[((worldSlot % count) + count) % count];
            chunk.visible = true;
            chunk.position.x = relCenterX;
            const tiles = chunk.userData.tiles;
            const fogFar = scene.fog.far;
            for (let t = 0; t < tiles.length; t++) {
              const u = tiles[t].userData;
              const wx = relCenterX + u.cx;
              // Spenta solo quando è interamente oltre la nebbia: nessuna comparsa visibile
              tiles[t].visible = Math.hypot(wx - camera.position.x, u.cz - camera.position.z) - u.r < fogFar;
            }
          }
        }
      }

      const rearX = state.distanceX - halfWB;
      const frontX = state.distanceX + halfWB;
      rearWheelGroup.rotation.z = rollRotFast(rearX, n);
      frontWheelGroup.rotation.z = rollRotFast(frontX, n);

      if (state.showGeometry) {
        const rearY = roadYFast(rearX, n);
        const frontY = roadYFast(frontX, n);
        for (let i = 0; i < contactDots.length; i++) {
          contactDots[i].position.y = (contactDots[i].userData.hx < 0 ? rearY : frontY) + 0.045;
        }
        hubLineMat.dashOffset = state.distanceX % 0.38;
        updateVertexTrail(n);
      }

      const rawCrankAngle = -(state.distanceX / FIXED_R) * 1.45;
      const crankAngle = rawCrankAngle - 0.08 * Math.sin(2 * rawCrankAngle);
      crankGroup.rotation.z = crankAngle;
      leftPedal.rotation.z = -crankAngle;
      rightPedal.rotation.z = -crankAngle;

      updateMannequinKinematics(crankAngle, Math.abs(Math.sin(crankAngle)) * 0.004, Math.sin(crankAngle) * 0.012);
      updateAstronomicalCycle(dt);
    }

    function getActiveGroundHeightAtWorld(wx, wz) {
      const roadBedY = TERRAIN_BED_Y;
      if (landscapeChunks.length === 0) return roadBedY;

      const worldX = wx + state.distanceX;
      const slot = Math.round(worldX / CHUNK_LEN);
      const localX = worldX - slot * CHUNK_LEN;
      const biomeIdx = ((slot % landscapeChunks.length) + landscapeChunks.length) % landscapeChunks.length;
      return Math.max(roadBedY, getBiomeTerrainHeight(biomeIdx, localX, wz));
    }

    function clampCameraAboveTerrain() {
      const cx = camera.position.x;
      const cz = camera.position.z;
      // Campiona il punto della camera e un piccolo intorno (r = 0.65 m) per evitare tagli del near-plane sulle scarpate
      const h0 = getActiveGroundHeightAtWorld(cx, cz);
      const h1 = getActiveGroundHeightAtWorld(cx + 0.65, cz);
      const h2 = getActiveGroundHeightAtWorld(cx - 0.65, cz);
      const h3 = getActiveGroundHeightAtWorld(cx, cz + 0.65);
      const h4 = getActiveGroundHeightAtWorld(cx, cz - 0.65);
      const minSafeY = Math.max(h0, h1, h2, h3, h4) + 0.85;

      // Sollevamento temporaneo: viene tolto all'inizio del frame successivo, la camera non sale a cricchetto
      if (camera.position.y < minSafeY) {
        state.camLift = minSafeY - camera.position.y;
        camera.position.y = minSafeY;
        state.needsRender = true;
      }
    }

    function updateCameraAnimation(dt) {
      const anim = state.cameraAnim;
      if (!anim) return;
      anim.elapsed += dt;
      const t = Math.min(1.0, anim.elapsed / anim.duration);
      const ease = easeInOutCubic(t);
      camera.position.lerpVectors(anim.fromPos, anim.toPos, ease);
      controls.target.lerpVectors(anim.fromTarget, anim.toTarget, ease);
      if (anim.fromFov !== anim.toFov) {
        camera.fov = THREE.MathUtils.lerp(anim.fromFov, anim.toFov, ease);
        camera.updateProjectionMatrix();
        updateHullScale();
      }
      if (t >= 1.0) state.cameraAnim = null;
      state.needsRender = true;
    }

    function renderFrame(dt, draw = true) {
      updateTour(dt);
      updateCameraAnimation(dt);
      if (state.camLift > 0) { camera.position.y -= state.camLift; state.camLift = 0; }
      const controlsMoved = controls.update();
      clampCameraAboveTerrain();
      // In pausa e a camera ferma non si ridisegna nulla
      if (state.isPlaying || controlsMoved || state.needsRender || state.sidesTransitionT < 1.0) {
        state.needsRender = false;
        updateSimulationFrame(dt);
        if (draw) renderer.render(scene, camera);
        return true;
      }
      return false;
    }

    // Qualità adattiva: 0 = piena; 1 = pixel ratio 1; 2 = ombre leggere e niente grana.
    // Scende se la media resta sopra ~24 ms per 2 s; riprova a salire dopo 10 s fluidi,
    // ma un gradino che ha già fallito non viene ritentato.
    const QUALITY = { tier: 0, ema: 16.7, slowMs: 0, fastMs: 0, failed: new Set(), lastUpgradeAt: -1 };
    const fullPixelRatio = () => Math.min(window.devicePixelRatio || 1, 1.5);

    function applyQualityTier(tier) {
      QUALITY.tier = tier;
      renderer.setPixelRatio(tier >= 1 ? 1 : fullPixelRatio());
      const lite = tier >= 2;
      if (lite !== (renderer.shadowMap.type === THREE.PCFShadowMap)) {
        renderer.shadowMap.type = lite ? THREE.PCFShadowMap : THREE.PCFSoftShadowMap;
        dirLight.shadow.mapSize.setScalar(lite ? 1024 : 2048);
        if (dirLight.shadow.map) { dirLight.shadow.map.dispose(); dirLight.shadow.map = null; }
        scene.traverse((o) => {
          if (o.material) [].concat(o.material).forEach((m) => { m.needsUpdate = true; });
        });
      }
      document.body.classList.toggle('lite', lite);
      QUALITY.ema = 16.7;
      QUALITY.slowMs = QUALITY.fastMs = 0;
      state.needsRender = true;
    }

    function trackQuality(rawMs) {
      if (rawMs > 250) return; // scheda nascosta o pausa del sistema: non è lentezza
      QUALITY.ema += (rawMs - QUALITY.ema) * 0.06;
      const now = performance.now();
      if (QUALITY.ema > 24) {
        QUALITY.slowMs += rawMs; QUALITY.fastMs = 0;
        if (QUALITY.slowMs > 2000 && QUALITY.tier < 2) {
          if (now - QUALITY.lastUpgradeAt < 6000) QUALITY.failed.add(QUALITY.tier);
          applyQualityTier(QUALITY.tier + 1);
        }
      } else if (QUALITY.ema < 18.5) {
        QUALITY.fastMs += rawMs; QUALITY.slowMs = 0;
        if (QUALITY.fastMs > 10000 && QUALITY.tier > 0 && !QUALITY.failed.has(QUALITY.tier - 1)) {
          QUALITY.lastUpgradeAt = now;
          applyQualityTier(QUALITY.tier - 1);
        }
      } else {
        QUALITY.slowMs = QUALITY.fastMs = 0;
      }
    }

    function animate(now) {
      requestAnimationFrame(animate);
      const rawMs = now - state.lastTime;
      const dt = Math.min(0.05, Math.max(0.001, rawMs * 0.001));
      state.lastTime = now;
      // Dietro l'intro opaca non si disegna nulla
      if (!state.simReady || state.manualClock || !state.introDismissed) return;

      if (renderFrame(dt)) trackQuality(rawMs);
    }

    // Aggancio per test automatici e demo guidate dalla console
    window.__polyCycle = {
      THREE, state, camera, controls, renderer, scene, CAT, VIEWS,
      applySides, setSpeed, setView, setLightMode, setGeometryVisible, startTour, stopTour, togglePlayPause,
      computeWheelRollingState, evalCatenaryY, rollRotFast,
      QUALITY, applyQualityTier, rearWheelGroup, frontWheelGroup, crankGroup, leftPedal, rightPedal, limbs, bikeGroup, geoGroup,
      stepFrame(dt, draw = true) { state.needsRender = true; return renderFrame(dt, draw); }
    };

    runIncrementalPreload();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
