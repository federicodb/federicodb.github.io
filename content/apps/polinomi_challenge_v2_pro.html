<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Polinomi Challenge 3D PRO</title>
    <meta name="description" content="Versione PRO della sfida 3D sui polinomi: Ghost Target, X-Ray mode e variabili dinamiche.">
    <meta name="keywords" content="Matematica, Algebra, Polinomi, Scomposizione, 3D, Nerdamer, 1 EL, PRO">
    <meta name="date" content="2026-05-27">

    <!-- Shared Orfini Design System -->
    <link rel="stylesheet" href="../assets/style/orfini-shared.css">
    <script src="../assets/js/orfini-shared.js"></script>
    
    <!-- Librerie Core -->
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/nerdamer.core.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Algebra.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nerdamer@1.1.13/Calculus.js"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --m3-surface: #000000;
            --m3-on-surface: #E6E1E5;
            --m3-surface-container: #121212;
            --m3-primary: #D0BCFF;
            --m3-outline: #49454F;
            --m3-error: #F2B8B5;
            --m3-success: #B4E197;
            --tile-x-logic: #3399FF;   
            --tile-unit-logic: #27ae60; 
        }

        body {
            background-color: var(--m3-surface);
            color: var(--m3-on-surface);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100dvh;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .full-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .m3-card-overlay {
            background: var(--m3-surface-container);
            padding: 48px;
            border-radius: 40px;
            width: 100%;
            max-width: 440px;
            border: 1px solid var(--m3-outline);
            text-align: center;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }

        .m3-top-bar {
            padding: 16px;
            background-color: var(--m3-surface);
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid #1a1a1a;
        }

        .m3-input-pill {
            width: 100%;
            border: 2px solid var(--m3-outline);
            border-radius: 28px;
            height: 60px;
            background: #080808;
            color: var(--m3-on-surface);
            padding: 0 24px;
            font-size: 18px;
            outline: none;
            transition: border-color 0.3s;
            text-align: center;
        }

        .m3-input-pill:focus { border-color: var(--m3-primary); }

        .m3-chip {
            height: 40px;
            padding: 0 16px;
            border: 1px solid var(--m3-outline);
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            color: var(--m3-on-surface);
            text-transform: uppercase;
        }
        .m3-chip.active {
            background-color: var(--m3-primary);
            color: #000;
            border-color: var(--m3-primary);
        }

        #canvas-container {
            width: 100%;
            height: 520px;
            background: #000;
            border-radius: 32px;
            overflow: hidden;
            position: relative;
            border: 1px solid #1a1a1a;
            touch-action: none;
        }

        .math-display { font-size: 2.2rem; color: #fff; }
        .hidden { display: none !important; }
        canvas { outline: none; }
        
        .btn-action {
            height: 60px;
            padding: 0 32px;
            border-radius: 30px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: transform 0.2s;
        }
        .btn-action:active { transform: scale(0.97); }

        .progress-dots {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-top: 12px;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #333;
            transition: all 0.3s;
        }
        .dot.active { background: var(--m3-primary); box-shadow: 0 0 10px var(--m3-primary); }
        .dot.completed { background: var(--m3-success); }
    </style>
</head>
<body>

    <!-- Overlay Accesso -->
    <div id="login-overlay" class="full-overlay">
        <div class="m3-card-overlay">
            <h1 class="text-3xl font-black text-white mb-2 tracking-tighter uppercase">Lab Access</h1>
            <p class="text-zinc-500 text-sm mb-10 font-medium tracking-wide">IDENTIFICAZIONE STUDENTE</p>
            <div class="flex flex-col gap-4 mb-10">
                <input type="text" id="user-name" class="m3-input-pill" placeholder="Nome">
                <input type="text" id="user-class" class="m3-input-pill" placeholder="Classe">
            </div>
            <button class="btn-action bg-[#D0BCFF] text-black w-full" onclick="initUser()">
                <span class="material-icons">bolt</span> AVVIA SESSIONE
            </button>
        </div>
    </div>

    <!-- Overlay Decisionale Fine Livello -->
    <div id="level-overlay" class="full-overlay hidden">
        <div class="m3-card-overlay">
            <span class="material-icons text-6xl text-[#B4E197] mb-4">emoji_events</span>
            <h2 class="text-2xl font-bold text-white mb-2 uppercase">Livello Superato</h2>
            <p class="text-zinc-500 text-sm mb-10">Hai completato correttamente 5 esercizi. Come vuoi procedere ora?</p>
            <div class="flex flex-col gap-4">
                <button id="next-level-btn" class="btn-action bg-[#D0BCFF] text-black w-full" onclick="advanceLevel()">
                    <span class="material-icons">trending_up</span> PROSSIMO LIVELLO
                </button>
                <button class="btn-action border border-[#49454F] text-white w-full" onclick="stayInLevel()">
                    <span class="material-icons">loop</span> CONTINUA PRATICA
                </button>
                <button class="btn-action bg-[#F2B8B5] text-black w-full" onclick="location.reload()">
                    <span class="material-icons">logout</span> ESCI
                </button>
            </div>
        </div>
    </div>

    <header class="m3-top-bar">
        <div class="flex justify-between items-center mb-4">
            <div>
                <div class="text-xl font-bold tracking-tight text-white uppercase">ORFINI <span class="text-[#D0BCFF] text-xs font-black tracking-widest ml-1">MATH LAB</span></div>
                <div id="user-info" class="text-[9px] text-zinc-500 font-mono uppercase">Unidentified</div>
            </div>
            <div class="text-right">
                <div id="score" class="text-xl font-black text-white">0</div>
                <div class="text-[8px] text-zinc-600 uppercase font-bold tracking-widest">XP Points</div>
            </div>
        </div>

        <nav class="flex flex-wrap gap-2">
            <button class="m3-chip active" id="chip-training" onclick="setMode('training')">Training</button>
            <button class="m3-chip" id="chip-base" onclick="setMode('base')">Base</button>
            <button class="m3-chip" id="chip-medio" onclick="setMode('medio')">Medio</button>
            <button class="m3-chip" id="chip-avanzato" onclick="setMode('avanzato')">Avanzato</button>
        </nav>
        
        <div class="progress-dots" id="session-progress">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
    </header>

    <main class="flex-grow p-4 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <section class="lg:col-span-8 flex flex-col gap-6">
            <div class="bg-[#080808] border border-[#1a1a1a] rounded-[32px] p-8 text-center shadow-2xl relative overflow-hidden">
                <div id="math-box" class="py-10 min-h-[160px] flex items-center justify-center math-display"></div>
                
                <div class="flex flex-col items-center gap-6 mt-4">
                    <div id="feedback" class="text-[10px] font-black text-zinc-600 uppercase tracking-[0.3em] mb-2">Pronto per la scomposizione</div>
                    
                    <input type="text" id="math-input" class="m3-input-pill w-full max-w-[500px]" placeholder="Inserisci fattorizzazione..." spellcheck="false" autocomplete="off">
                    
                    <div class="flex gap-4 w-full justify-center" id="controls-standard">
                        <button id="btn-xray" class="btn-action border border-cyan-500/30 text-cyan-400" onclick="toggleXray()">
                            <span class="material-icons">visibility</span> X-RAY
                        </button>
                        <button class="btn-action bg-[#D0BCFF] text-black px-12" onclick="validate()">
                            <span class="material-icons">task_alt</span> VERIFICA
                        </button>
                    </div>

                    <div class="flex gap-4 hidden w-full justify-center" id="controls-solved">
                        <button class="btn-action bg-[#B4E197] text-black w-full max-w-[500px] shadow-xl" onclick="handleNext()">
                            <span class="material-icons">arrow_forward</span> AVANTI
                        </button>
                    </div>
                </div>
            </div>

            <div id="canvas-container"></div>
        </section>

        <aside class="lg:col-span-4 flex flex-col gap-6">
            <div class="bg-[#000] border border-[#1a1a1a] rounded-[32px] p-6 h-full flex flex-col">
                <h3 class="text-[9px] font-black text-zinc-600 uppercase mb-8 flex items-center gap-2 tracking-[0.2em]">
                    <span class="material-icons text-sm">history</span> Session History
                </h3>
                <div id="history" class="space-y-4 flex-grow overflow-y-auto pr-2"></div>
                
                <div class="mt-8 pt-8 border-t border-[#1a1a1a]">
                    <h3 class="text-[9px] font-black text-zinc-600 uppercase mb-4 tracking-[0.2em]">Leaderboard</h3>
                    <div id="leaderboard" class="space-y-3"></div>
                </div>
            </div>
        </aside>
    </main>

    <script>
        nerdamer.set('RESERVE_NAMES', ['x', 'y', 'z']);
        const COLORS = { 
            x3: 0xD0BCFF, // Purple (Vol 3)
            x2: 0x3399FF, // Blue (Vol 2)
            x1: 0xB4E197, // Green (Vol 1)
            u: 0xFFD700   // Gold (Unit)
        };
        const MODES = ['training', 'base', 'medio', 'avanzato'];

        let state = {
            user: { name: '', class: '', score: 0 },
            current: null,
            mode: 'training',
            history: [],
            seen: new Set(),
            isSolved: false,
            xray: false,
            v: 'x', // Variabile corrente
            transition: 0,
            completedInLevel: 0
        };

        const CONFIG = { xSize: 2.8, ySize: 2.2, zSize: 1.6, unitSize: 1.0, scatter: 10 };
        let scene, camera, renderer, controls, blocksGroup;

        function initThree() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            const light1 = new THREE.DirectionalLight(0xffffff, 1.3);
            light1.position.set(10, 20, 10);
            scene.add(light1);
            const light2 = new THREE.DirectionalLight(0x88aaff, 0.6);
            light2.position.set(-10, -5, -10);
            scene.add(light2);
            scene.add(new THREE.AmbientLight(0x404040, 2.5));

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;

            blocksGroup = new THREE.Group();
            ghostGroup = new THREE.Group();
            scene.add(blocksGroup);
            scene.add(ghostGroup);

            function animate() {
                requestAnimationFrame(animate);
                const targetFactor = state.isSolved ? 1 : 0;
                state.transition += (targetFactor - state.transition) * 0.06;

                blocksGroup.children.forEach(mesh => {
                    const d = mesh.userData;
                    mesh.position.lerpVectors(d.startPos, d.targetPos, state.transition);
                    mesh.quaternion.slerpQuaternions(d.startQuat, d.targetQuat, state.transition);
                    // Effetto dissolvenza ghost quando risolto
                    ghostGroup.children.forEach(g => g.material.opacity = (1 - state.transition) * 0.15);
                });

                controls.update();
                renderer.render(scene, camera);
            }
            animate();
        }

        function createBlock(w, h, d, x, y, z) {
            const geometry = new THREE.BoxGeometry(w - 0.05, h - 0.05, d - 0.05); // Micro-gap per effetto moduli
            
            // Determinazione colore semantica basata sulle dimensioni esatte del blocco per garantire varietà cromatica
            const dimsKey = [w, h, d].map(v => Math.round(v * 10)).sort((a,b)=>a-b).join('-');
            const colorMap = {
                '10-10-10': 0xFFD700, // u (Gold)
                '10-10-28': 0xB4E197, // x (Green)
                '10-10-22': 0x97E1D4, // y (Teal)
                '10-10-16': 0xD4E197, // z (Yellow-Green)
                '10-28-28': 0x3399FF, // x^2 (Blue)
                '10-22-22': 0x33B5FF, // y^2 (Light Blue)
                '10-16-16': 0x33FFB5, // z^2 (Cyan-Green)
                '10-22-28': 0x8833FF, // xy (Purple)
                '10-16-28': 0xFF33AA, // xz (Pink)
                '10-16-22': 0xFF8833, // yz (Orange)
                '28-28-28': 0xD0BCFF, // x^3 (Light Purple)
                '22-22-22': 0xFFBCD0, // y^3 (Light Pink)
                '16-16-16': 0xD0FFBC, // z^3 (Light Green)
                '16-22-28': 0xFF5555  // xyz (Red)
            };
            let color = colorMap[dimsKey] || 0xCCCCCC;

            const material = new THREE.MeshPhongMaterial({ 
                color: color, 
                shininess: 80, 
                specular: 0x333333,
                transparent: true,
                opacity: 0.9
            });
            const mesh = new THREE.Mesh(geometry, material);
            const edges = new THREE.EdgesGeometry(geometry);
            mesh.add(new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.3 })));

            mesh.userData.targetPos = new THREE.Vector3(x + w/2, y + h/2, z + d/2);
            mesh.userData.targetQuat = new THREE.Quaternion().identity();
            mesh.userData.startPos = new THREE.Vector3((Math.random()-0.5)*30, (Math.random()-0.5)*30, (Math.random()-0.5)*30);
            mesh.userData.startQuat = new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI));

            mesh.position.copy(mesh.userData.startPos);
            mesh.quaternion.copy(mesh.userData.startQuat);
            return mesh;
        }

        function build3D(factors) {
            state.isSolved = false; state.transition = 0;
            document.getElementById('controls-standard').classList.remove('hidden');
            document.getElementById('controls-solved').classList.add('hidden');
            while(blocksGroup.children.length > 0) blocksGroup.remove(blocksGroup.children[0]);
            
            const getParts = (f) => f;

            // Distribuzione intelligente dei fattori nelle 3 dimensioni per formare un parallelepipedo
            let dims = [[CONFIG.unitSize], [CONFIG.unitSize], [CONFIG.unitSize]];
            
            // Mappa i fattori alle dimensioni X, Y, Z in modo ciclico
            factors.forEach((f, i) => {
                const targetDim = i % 3;
                const parts = getParts(f);
                if (dims[targetDim].length === 1 && dims[targetDim][0] === CONFIG.unitSize) {
                    dims[targetDim] = parts;
                } else {
                    // Se la dimensione ha già parti, moltiplichiamo la complessità (raccoglimento totale)
                    // In questo caso semplifichiamo accodando per mantenere la forma a blocchi
                    dims[targetDim] = dims[targetDim].concat(parts);
                }
            });

            let partsX = dims[0], partsY = dims[1], partsZ = dims[2];

            let accX = 0;
            partsX.forEach(w => {
                let accY = 0;
                partsY.forEach(h => {
                    let accZ = 0;
                    partsZ.forEach(d => {
                        blocksGroup.add(createBlock(w, h, d, accX, accY, accZ));
                        accZ += d;
                    });
                    accY += h;
                });
                accX += w;
            });

            const box = new THREE.Box3().setFromObject(blocksGroup);
            const center = new THREE.Vector3(); box.getCenter(center);
            blocksGroup.children.forEach(c => {
                c.userData.targetPos.sub(center);
                c.material.opacity = state.xray ? 0.3 : 0.9;
            });

            // Creazione Ghost Wireframe (Target Shape)
            while(ghostGroup.children.length > 0) ghostGroup.remove(ghostGroup.children[0]);
            const size = new THREE.Vector3(); box.getSize(size);
            const ghostGeom = new THREE.BoxGeometry(size.x, size.y, size.z);
            const ghostWire = new THREE.LineSegments(
                new THREE.EdgesGeometry(ghostGeom),
                new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.15 })
            );
            ghostGroup.add(ghostWire);
            ghostGroup.position.set(0,0,0); 

            controls.target.set(0,0,0);
            const maxDim = Math.max(size.x, size.y, size.z, 5);
            camera.position.set(maxDim * 1.5, maxDim * 1.5, maxDim * 1.5);
            camera.updateProjectionMatrix();
        }

        const Generator = {
            vars: ['x', 'y', 'a', 'b', 'z'],
            getV: () => Generator.vars[Math.floor(Math.random() * Generator.vars.length)],
            getDistinctVars: (n) => {
                let shuffled = [...Generator.vars].sort(() => 0.5 - Math.random());
                return shuffled.slice(0, n);
            },
            getSizes: () => [CONFIG.xSize, CONFIG.ySize, CONFIG.zSize],

            training: () => {
                const v = state.v;
                const vS = CONFIG.xSize;
                const uS = CONFIG.unitSize;
                const k = Math.floor(Math.random() * 12) + 2;
                const a = Math.floor(Math.random() * 8) + 1;
                const templates = [
                    () => ({ orig: `${k}${v} + ${k*a}`, factors: [ Array(k).fill(uS), [vS, ...Array(a).fill(uS)] ], target: `${k}(${v}+${a})` }),
                    () => ({ orig: `${k}${v}^2 + ${k*a}${v}`, factors: [ Array(k).fill(uS), [vS], [vS, ...Array(a).fill(uS)] ], target: `${k}${v}(${v}+${a})` }),
                    () => ({ orig: `${k}${v}^2 + ${k}${v}`, factors: [ Array(k).fill(uS), [vS], [vS, uS] ], target: `${k}${v}(${v}+1)` })
                ];
                return templates[Math.floor(Math.random()*templates.length)]();
            },
            base: () => {
                const v = state.v;
                const vS = CONFIG.xSize;
                const uS = CONFIG.unitSize;
                const a = Math.floor(Math.random() * 6) + 1;
                const b = Math.floor(Math.random() * 6) + 1;
                const templates = [
                    () => ({ orig: nerdamer(`(${v}+${a})^2`).expand().toString(), factors: [ [vS, ...Array(a).fill(uS)], [vS, ...Array(a).fill(uS)] ], target: `(${v}+${a})^2` }),
                    () => ({ orig: nerdamer(`(${v}-${a})(${v}+${a})`).expand().toString(), factors: [ [vS, ...Array(a).fill(uS)], [vS, ...Array(a).fill(uS)] ], target: `(${v}-${a})(${v}+${a})` }),
                    () => ({ orig: nerdamer(`(${v}+${a})(${v}+${b})`).expand().toString(), factors: [ [vS, ...Array(a).fill(uS)], [vS, ...Array(b).fill(uS)] ], target: `(${v}+${a})(${v}+${b})` }),
                    () => ({ orig: nerdamer(`${v}^2 + ${2*a}${v} + ${a*a}`).expand().toString(), factors: [ [vS, ...Array(a).fill(uS)], [vS, ...Array(a).fill(uS)] ], target: `(${v}+${a})^2` })
                ];
                return templates[Math.floor(Math.random()*templates.length)]();
            },
            medio: () => {
                const v = state.v;
                const vS = CONFIG.xSize;
                const uS = CONFIG.unitSize;
                const a = Math.floor(Math.random() * 5) + 1;
                const b = Math.floor(Math.random() * 5) + 1;
                const k = Math.floor(Math.random() * 6) + 2;
                const templates = [
                    () => ({ orig: nerdamer(`${k}*(${v}^2 - ${a*a})`).expand().toString(), factors: [ Array(k).fill(uS), [vS, ...Array(a).fill(uS)], [vS, ...Array(a).fill(uS)] ], target: `${k}(${v}-${a})(${v}+${a})` }),
                    () => ({ orig: nerdamer(`${k}*(${v}+${a})^2`).expand().toString(), factors: [ Array(k).fill(uS), [vS, ...Array(a).fill(uS)], [vS, ...Array(a).fill(uS)] ], target: `${k}(${v}+${a})^2` }),
                    () => ({ orig: nerdamer(`${k}*(${v}+${a})*(${v}+${b})`).expand().toString(), factors: [ Array(k).fill(uS), [vS, ...Array(a).fill(uS)], [vS, ...Array(b).fill(uS)] ], target: `${k}(${v}+${a})(${v}+${b})` }),
                    () => ({ orig: nerdamer(`${v}*(${v}+${a})*(${v}+${b})`).expand().toString(), factors: [ [vS], [vS, ...Array(a).fill(uS)], [vS, ...Array(b).fill(uS)] ], target: `${v}(${v}+${a})(${v}+${b})` })
                ];
                return templates[Math.floor(Math.random()*templates.length)]();
            },
            avanzato: () => {
                const vars = Generator.getDistinctVars(3);
                const v1 = vars[0], v2 = vars[1], v3 = vars[2];
                const sizes = Generator.getSizes();
                const s1 = sizes[0], s2 = sizes[1], s3 = sizes[2];
                const uS = CONFIG.unitSize;
                const a = Math.floor(Math.random() * 3) + 1;
                const b = Math.floor(Math.random() * 3) + 1;
                const k = Math.floor(Math.random() * 3) + 2;
                
                const templates = [
                    // Differenza di quadrati con due variabili
                    () => ({ 
                        orig: nerdamer(`(${v1}-${v2})*(${v1}+${v2})`).expand().toString(), 
                        factors: [ [s1, s2], [s1, s2] ], 
                        target: `(${v1}-${v2})(${v1}+${v2})` 
                    }),
                    // Quadrato di binomio con due variabili
                    () => ({ 
                        orig: nerdamer(`(${v1}+${v2})^2`).expand().toString(), 
                        factors: [ [s1, s2], [s1, s2] ], 
                        target: `(${v1}+${v2})^2` 
                    }),
                    // Volume 3D k*(v1+v2)^2
                    () => ({ 
                        orig: nerdamer(`${k}*(${v1}+${v2})^2`).expand().toString(), 
                        factors: [ Array(k).fill(uS), [s1, s2], [s1, s2] ], 
                        target: `${k}(${v1}+${v2})^2` 
                    }),
                    // Volume 3D (v1+v2)(v1-v2)*v3
                    () => ({ 
                        orig: nerdamer(`${v3}*(${v1}-${v2})*(${v1}+${v2})`).expand().toString(), 
                        factors: [ [s3], [s1, s2], [s1, s2] ], 
                        target: `${v3}(${v1}-${v2})(${v1}+${v2})` 
                    }),
                    // Volume 3D v1*(v2+a)*(v3+b)
                    () => ({ 
                        orig: nerdamer(`${v1}*(${v2}+${a})*(${v3}+${b})`).expand().toString(), 
                        factors: [ [s1], [s2, ...Array(a).fill(uS)], [s3, ...Array(b).fill(uS)] ], 
                        target: `${v1}(${v2}+${a})(${v3}+${b})` 
                    }),
                    // Raccoglimento a fattore comune a più variabili
                    () => ({
                        orig: nerdamer(`${k}*${v1}*${v2}*(${v1}+${v2})`).expand().toString(),
                        factors: [ Array(k).fill(s1), [s2], [s1, s2] ],
                        target: `${k}${v1}${v2}(${v1}+${v2})`
                    })
                ];
                return templates[Math.floor(Math.random()*templates.length)]();
            }
        };

        function initUser() {
            const n = document.getElementById('user-name').value.trim();
            const c = document.getElementById('user-class').value.trim();
            if(!n || !c) return;
            state.user = { name: n, class: c, score: 0 };
            document.getElementById('login-overlay').classList.add('hidden');
            document.getElementById('user-info').innerText = `${n} | ${c}`;
            loadLeaderboard();
            newProblem();
        }

        function newProblem() {
            state.v = Generator.getV(); // Nuova variabile per questo problema
            let prob;
            let attempts = 0;
            do {
                prob = Generator[state.mode]();
                attempts++;
            } while (state.seen.has(prob.orig) && attempts < 50);
            
            state.seen.add(prob.orig);
            state.current = prob;
            
            document.getElementById('math-input').value = '';
            document.getElementById('feedback').innerText = "Risolvi per ricostruire il volume";
            document.getElementById('feedback').style.color = "";
            const tex = nerdamer(state.current.orig).toTeX().replace(/\\cdot/g, '');
            katex.render(tex, document.getElementById('math-box'), { throwOnError: false });
            build3D(state.current.factors);
            updateProgressDots();
        }

        function handleNext() {
            if (state.completedInLevel >= 5) showLevelCompletion();
            else newProblem();
        }

        function validate() {
            const val = document.getElementById('math-input').value.trim().replace(/\s/g, '');
            if(!val) return;
            try {
                const u = nerdamer(val).expand().toString();
                const t = nerdamer(state.current.target).expand().toString();
                if(u === t && (val.includes('(') || val.includes('^'))) {
                    state.isSolved = true; state.completedInLevel++; state.user.score += 500;
                    document.getElementById('score').innerText = state.user.score;
                    state.history.unshift({ o: state.current.orig, f: val });
                    updateHistory(); saveScore(); updateProgressDots();
                    document.getElementById('feedback').innerText = "CORRETTO. SOLIDO COMPATTATO.";
                    document.getElementById('feedback').style.color = "var(--m3-success)";
                    document.getElementById('controls-standard').classList.add('hidden');
                    document.getElementById('controls-solved').classList.remove('hidden');
                } else throw new Error();
            } catch(e) {
                document.getElementById('feedback').innerText = "Scomposizione non corretta.";
                document.getElementById('feedback').style.color = "var(--m3-error)";
            }
        }

        function toggleXray() {
            state.xray = !state.xray;
            const btn = document.getElementById('btn-xray');
            btn.classList.toggle('bg-cyan-900/40', state.xray);
            blocksGroup.children.forEach(c => {
                c.material.opacity = state.xray ? 0.3 : 0.9;
            });
        }

        function updateProgressDots() {
            const dots = document.querySelectorAll('.dot');
            dots.forEach((dot, i) => {
                dot.className = 'dot';
                if (i < state.completedInLevel) dot.classList.add('completed');
                else if (i === state.completedInLevel && !state.isSolved) dot.classList.add('active');
            });
        }

        function showLevelCompletion() {
            const modeIndex = MODES.indexOf(state.mode);
            document.getElementById('next-level-btn').classList.toggle('hidden', modeIndex >= MODES.length - 1);
            document.getElementById('level-overlay').classList.remove('hidden');
        }

        function stayInLevel() {
            state.completedInLevel = 0;
            document.getElementById('level-overlay').classList.add('hidden');
            newProblem();
        }

        function advanceLevel() {
            const nextIdx = MODES.indexOf(state.mode) + 1;
            if (nextIdx < MODES.length) setMode(MODES[nextIdx]);
            document.getElementById('level-overlay').classList.add('hidden');
        }

        function setMode(m) {
            state.mode = m; state.completedInLevel = 0;
            document.querySelectorAll('.m3-chip').forEach(c => c.classList.remove('active'));
            document.getElementById(`chip-${m}`).classList.add('active');
            newProblem();
        }

        function updateHistory() {
            const h = document.getElementById('history'); h.innerHTML = "";
            state.history.forEach((item) => {
                const div = document.createElement('div');
                div.className = "bg-[#111] p-4 rounded-2xl border border-[#222] text-xs text-zinc-300";
                katex.render(`${nerdamer(item.o).toTeX()} = ${nerdamer(item.f).toTeX()}`.replace(/\\cdot/g, ''), div, { throwOnError: false });
                h.appendChild(div);
            });
        }

        function saveScore() {
            let b = JSON.parse(localStorage.getItem('nerd_3d_v20') || '[]');
            const i = b.findIndex(e => e.n === state.user.name && e.c === state.user.class);
            if(i > -1) b[i].s = Math.max(b[i].s, state.user.score); 
            else b.push({n: state.user.name, c: state.user.class, s: state.user.score});
            b.sort((a,b) => b.s - a.s);
            localStorage.setItem('nerd_3d_v20', JSON.stringify(b.slice(0, 5)));
            loadLeaderboard();
        }

        function loadLeaderboard() {
            const b = JSON.parse(localStorage.getItem('nerd_3d_v20') || '[]');
            document.getElementById('leaderboard').innerHTML = b.map((e,i) => `
                <div class="flex justify-between items-center bg-[#0a0a0a] p-3 rounded-2xl border border-[#222]">
                    <div class="flex items-center gap-3">
                        <span class="text-[10px] font-black text-[#D0BCFF]">#${i+1}</span>
                        <div class="text-left text-xs font-bold text-white uppercase">${e.n} <span class="text-[8px] text-zinc-600 block">${e.c}</span></div>
                    </div>
                    <div class="font-bold text-xs text-[#D0BCFF]">${e.s}</div>
                </div>`).join('');
        }

        window.onload = () => {
            initThree();
            window.addEventListener('resize', () => {
                renderer.setSize(document.getElementById('canvas-container').clientWidth, 520);
                camera.aspect = document.getElementById('canvas-container').clientWidth / 520;
                camera.updateProjectionMatrix();
            });
        };
    </script>
</body>
</html>
