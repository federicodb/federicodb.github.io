<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Math Pool: Biliardo Cartesiano e retta</title>
<link rel="stylesheet" href="../assets/style/orfini-shared.css">
<meta name="description" content="Biliardo 3D sul piano cartesiano con fisica vera: calcola pendenza, intercetta ed equazione della retta per mandare la palla in buca, usa pendenze e simmetrie per i tiri di sponda e la parabola (dal vertice o dagli zeri, come prodotto di due rette) per i tiri a effetto. Per smartphone, tablet, PC e LIM.">
<meta name="keywords" content="Matematica, Geometria Analitica, Retta, Parabola, Piano Cartesiano, Biliardo, Gamification, Simmetria, 2 GP, 3 MEC">
<meta name="date" content="2026-10-29">
<script src="../assets/js/orfini-shared.js"></script>
<!--
  Math Pool 3D · serie giochi Orfini Math Lab (skill orfini-games, template 3D)
  Grafica: Three.js 0.186.1 (MIT) · Fisica del biliardo scritta per questo gioco (passo fisso 60 Hz, 4 sottopassi)
  Audio: Web Audio sintetizzato · Nessun asset esterno: panno, palle e numeri sono disegnati via canvas.
  Parametri URL: ?lim (modalità LIM) · ?debug (pannello prestazioni e window.__orfini per i test)
-->
<style>
  :root {
    --sfondo: #000; --pannello: rgba(8, 8, 10, .94); --pannello2: #111116; --bordo: rgba(255,255,255,.13);
    --testo: #eef0fa; --testo2: #9ba1b6; --accento: #4cc9f0; --su-accento: #000;

    color-scheme: dark;
  }
  :root[data-lim] { --u: clamp(22px, 1.9vmin, 40px); --tocco: max(64px, calc(var(--u) * 2.6)); }
  html, body { margin: 0; height: 100%; overflow: hidden !important; background: var(--sfondo) !important; color: var(--testo);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
  #gioco { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: crosshair; }
  .nascosto { display: none !important; }
  button { font: inherit; color: inherit; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .4em; min-width: var(--tocco); min-height: var(--tocco);
    padding: 0 calc(var(--u) * .7); border: 1px solid var(--bordo); border-radius: calc(var(--u) * .7); background: var(--pannello2);
    color: var(--testo); font-size: calc(var(--u) * .9); font-weight: 650; cursor: pointer; touch-action: manipulation;
    transition: transform .08s, background .15s, border-color .15s; }
  .btn svg { width: calc(var(--u) * 1.25); height: calc(var(--u) * 1.25); flex: none; }
  .btn:active { transform: scale(.94); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn[aria-pressed="true"] { background: var(--accento); color: var(--su-accento); border-color: var(--accento); }
  .btn.primario { background: var(--accento); color: var(--su-accento); border-color: var(--accento); }
  .btn:focus-visible, .campo:focus-visible, summary:focus-visible, .sw:focus-visible { outline: 3px solid var(--avviso); outline-offset: 2px; }
  .btn.mini { min-width: calc(var(--tocco) * .9); padding: 0; font-size: calc(var(--u) * 1.2); }

  /* testata: comandi e punteggio in alto a sinistra, accanto al tasto home */
  #testata { position: fixed; z-index: 4; top: max(10px, env(safe-area-inset-top)); left: calc(max(10px, env(safe-area-inset-left)) + 48px);
    display: flex; flex-wrap: wrap; align-items: center; gap: calc(var(--u) * .5); max-width: calc(100vw - 68px); pointer-events: none; }
  .barra { display: flex; gap: calc(var(--u) * .2); padding: calc(var(--u) * .2); background: var(--pannello); border: 1px solid var(--bordo);
    border-radius: calc(var(--u) * .9); pointer-events: auto; }
  .barra .btn { min-width: var(--tocco); padding: 0; border-color: transparent; background: transparent; }
  .barra .btn[aria-pressed="true"] { background: var(--accento); }
  .hud { font-size: calc(var(--u) * .9); font-weight: 650; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px #000;

  .hud .serie { color: var(--avviso); }

  :root[data-layout="lato"] #testata { max-width: calc(100vw - var(--lato-w) - 68px); }

  #etichette { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
  .etichetta { position: absolute; left: 0; top: 0; padding: .12em .5em; border-radius: 999px;
    font: 700 calc(var(--u) * .75)/1.3 ui-monospace, "SFMono-Regular", Menlo, monospace; background: rgba(0,0,0,.75);
    border: 1px solid var(--bordo); color: var(--testo); white-space: nowrap; }
  .etichetta.P { border-color: #fff; } .etichetta.Q { border-color: var(--accento); color: var(--accento); }
  .etichetta.B { border-color: var(--avviso); color: var(--avviso); } .etichetta.I, .etichetta.R { border-color: var(--ok); color: var(--ok); }
  .etichetta.m { font-size: calc(var(--u) * .68); color: var(--avviso); }
  .etichetta.no { color: var(--errore); border-color: var(--errore); }
  .etichetta.sponda { background: var(--accento); color: var(--su-accento); border-color: var(--accento); }
  #carica { position: fixed; z-index: 3; pointer-events: none; width: calc(var(--u) * 3.4); height: calc(var(--u) * 3.4);
    margin: calc(var(--u) * -1.7) 0 0 calc(var(--u) * -1.7); border-radius: 50%; left: 0; top: 0;
    background: conic-gradient(var(--accento) calc(var(--k, 0) * 360deg), rgba(255,255,255,.18) 0);
    -webkit-mask: radial-gradient(circle, transparent 60%, #000 62%); mask: radial-gradient(circle, transparent 60%, #000 62%); }
  #carica.agganciata { background: conic-gradient(var(--ok) calc(var(--k, 0) * 360deg), rgba(255,255,255,.18) 0); }
  #avviso { position: fixed; z-index: 6; left: var(--cx, 50%); top: calc(var(--ty, 70px) + 6px); transform: translateX(-50%);
    width: max-content; max-width: min(90vw, 26em); padding: .55em 1em; border-radius: calc(var(--u) * .8); font-size: var(--u); font-weight: 650;
    background: var(--pannello2); border: 1px solid var(--bordo); text-align: center; pointer-events: none; }
  #avviso.errore { border-color: var(--errore); color: var(--errore); } #avviso.ok { border-color: var(--ok); color: var(--ok); }
  #grande { position: fixed; z-index: 3; left: var(--cx, 50%); top: var(--cy, 40%); transform: translate(-50%, -50%) scale(.6);
    font-size: calc(var(--u) * 4); font-weight: 900; letter-spacing: .06em; color: var(--accento); opacity: 0; pointer-events: none;
    text-shadow: 0 0 24px var(--accento); }
  #grande.via { animation: grande 1.3s ease-out; }
  @keyframes grande { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
    70% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -60%) scale(1); } }
  #lampo { position: fixed; inset: 0; z-index: 7; pointer-events: none; box-shadow: inset 0 0 0 0 transparent; transition: box-shadow .25s; }
  #lampo.ok { box-shadow: inset 0 0 0 6px var(--ok); } #lampo.errore { box-shadow: inset 0 0 0 6px var(--errore); }
  #lampo.urto { box-shadow: inset 0 0 0 4px var(--accento); }

  /* pannello: bottom sheet in verticale, cassetto laterale in orizzontale */
  #pannello { position: fixed; z-index: 5; display: grid; background: var(--pannello); border: 1px solid var(--bordo);
    font-size: var(--u); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-sizing: border-box; }
  :root[data-layout="sotto"] #pannello { left: 0; right: 0; bottom: 0; height: var(--h-meta, 46dvh); grid-template-rows: auto 1fr auto; grid-template-columns: 100%;
    border-radius: calc(var(--u) * 1.1) calc(var(--u) * 1.1) 0 0; border-bottom: 0; padding-bottom: env(safe-area-inset-bottom);
    transition: height .25s ease; }
  :root[data-layout="sotto"] #pannello[data-stato="chiuso"] { height: calc(var(--tocco) + env(safe-area-inset-bottom)); }
  :root[data-layout="sotto"] #pannello[data-stato="pieno"] { height: calc(100dvh - var(--sotto-testata, 14dvh)); }   /* aperto del tutto: arriva sotto la barra dei comandi, non sopra */
  :root[data-layout="lato"] #pannello { top: 0; bottom: 0; right: 0; width: var(--lato-w); grid-template-columns: calc(var(--u) * 2.4) minmax(0, 1fr);
    grid-template-rows: 1fr auto; border-right: 0; border-radius: calc(var(--u) * 1.1) 0 0 calc(var(--u) * 1.1);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) 0; transition: transform .25s ease; }
  :root[data-layout="lato"] #pannello[data-stato="chiuso"] { transform: translateX(calc(100% - var(--u) * 2.4)); }
  #maniglia { display: flex; align-items: center; justify-content: center; gap: .6em; border: 0; background: transparent; cursor: pointer;
    min-height: var(--tocco); padding: 0 1em; font-size: calc(var(--u) * .85); font-weight: 650; color: var(--testo2); touch-action: none; min-width: 0; }
  #maniglia .tacca { width: calc(var(--u) * 2.4); height: 5px; border-radius: 3px; background: rgba(255,255,255,.35); flex: none; }
  :root[data-layout="lato"] #maniglia { grid-row: 1 / 3; flex-direction: column; padding: 1em 0; writing-mode: vertical-rl; }
  :root[data-layout="lato"] #maniglia .tacca { width: 5px; height: calc(var(--u) * 2.4); }
  #manigliaTesto { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 85%; }
  #corpo { overflow-y: auto; overscroll-behavior: contain; padding: 0 calc(var(--u) * .9) calc(var(--u) * .9); min-height: 0; container-type: inline-size;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent; }
  /* le formule non vanno mai a capo: si restringono e, al limite, scorrono da sole */
  .unariga { white-space: nowrap; overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent; }
  :root[data-layout="lato"] #corpo { padding-top: calc(var(--u) * .8); }
  #pannello[data-stato="chiuso"] #corpo, #pannello[data-stato="chiuso"] #tastierino { visibility: hidden; }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; margin-bottom: calc(var(--u) * .7);
    background: #000; border: 1px solid var(--bordo); border-radius: calc(var(--u) * .8); }
  .tabs button { min-height: var(--tocco); border: 0; border-radius: calc(var(--u) * .6); background: transparent;
    color: var(--testo2); font-weight: 700; font-size: calc(var(--u) * .9); cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--accento); color: var(--su-accento); }
  .testa-liv { display: flex; align-items: center; gap: .5em; }
  .testa-liv .liv { flex: 1; text-align: center; line-height: 1.25; }
  .testa-liv .liv span { display: block; font-size: .78em; color: var(--testo2); }
  /* set di tavoli: un pallino per tavolo, pieno con le stelle prese, bordato quello in corso */
  .set { display: flex; align-items: center; justify-content: center; gap: .35em; margin-top: .3em; font-size: .78em; color: var(--testo); }
  .set i { width: 1.05em; height: 1.05em; border-radius: 50%; border: 2px solid var(--bordo); box-sizing: border-box; font-style: normal;
    display: inline-grid; place-items: center; font-size: .8em; font-weight: 800; }
  .set i.fatto { background: var(--avviso); border-color: var(--avviso); color: #000; }
  .set i.ora { border-color: var(--accento); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accento) 35%, transparent); }
  .set b { margin-left: .3em; }
  .consegna { margin: .7em 0; line-height: 1.45; color: var(--testo); font-size: .95em; }
  .obiettivo { display: block; padding: .65em .8em; border: 1px solid color-mix(in srgb, var(--accento) 45%, transparent); background: color-mix(in srgb, var(--accento) 7%, transparent); border-radius: calc(var(--u) * .7); line-height: 1.5; text-wrap: pretty; }
  .consegna .coord { display: block; margin-top: .45em; font-family: ui-monospace, Menlo, monospace; font-weight: 700; white-space: nowrap; overflow-x: auto; }
  .passi { list-style: none; margin: 0; padding: 0; display: grid; gap: .45em; }
  .passo { border: 1px solid var(--bordo); border-radius: calc(var(--u) * .8); padding: .55em .7em; background: #050506; }
  .passo .tit { display: flex; align-items: center; gap: .55em; }
  .passo h3 { margin: 0; font-size: 1em; line-height: 1.3; text-wrap: balance; }
  .num { display: inline-grid; place-items: center; width: 1.6em; height: 1.6em; border-radius: 50%; flex: none;
    background: rgba(255,255,255,.1); font-size: .8em; font-weight: 800; }
  .passo.attivo { border-color: var(--accento); padding: .8em; }
  .passo.attivo .num { background: var(--accento); color: var(--su-accento); }
  .passo.fatto { display: flex; flex-wrap: wrap; align-items: center; gap: .2em .55em; font-size: .88em; color: var(--testo2); }
  .passo.fatto .tit-fatto { flex: 1 1 8em; min-width: 0; line-height: 1.3; }
  .passo.fatto .num { background: var(--ok); color: #000; }
  .passo.fatto .ris { margin-left: auto; max-width: 100%; color: var(--testo); font-family: ui-monospace, Menlo, monospace; white-space: nowrap; overflow-x: auto; }
  .passo.futuro { display: flex; align-items: center; gap: .55em; opacity: .4; font-size: .88em; }
  .spiega { margin: .5em 0 .8em; color: var(--testo2); line-height: 1.5; font-size: .92em; text-wrap: pretty; }
  .formula { display: flex; flex-wrap: nowrap; align-items: center; justify-content: safe center; gap: .3em; margin: .5em 0 .8em; padding: 2px 0;
    font: 700 clamp(.9em, 5.2cqi, 1.15em) ui-monospace, Menlo, monospace; white-space: nowrap; overflow-x: auto; }
  .lett { white-space: nowrap; }
  .segno.via { display: none; }
  .campo { width: 3.8em; flex: none; min-height: calc(var(--tocco) * .9); box-sizing: border-box; padding: .2em .3em; text-align: center;
    font: 700 1em ui-monospace, Menlo, monospace; color: var(--testo); background: #000; border: 2px solid var(--bordo); border-radius: .5em; }
  .campo:focus { border-color: var(--accento); outline: none; }
  .campo.no { border-color: var(--errore); } .campo.si { border-color: var(--ok); }
  .azioni { display: flex; gap: .5em; } .azioni .primario { flex: 1; }
  .scelte { display: grid; gap: .45em; }
  .lab-mq { padding: .2em 0 .4em; }
  .cursore { display: grid; grid-template-columns: 3.2em minmax(0, 1fr) 4.4em; align-items: center; gap: .55em; margin: .35em 0; font-weight: 700; }
  .cursore input[type=range] { width: 100%; min-height: var(--tocco); margin: 0; accent-color: var(--accento); }
  .cursore .campo { width: 100%; }
  .cursore b { text-align: center; font-variant-numeric: tabular-nums; }
  .cursore.due { grid-template-columns: 4.6em minmax(0, 1fr); }
  .regola { margin-top: .3em; }
  .verso { margin: .3em 0; } .verso .sw { flex: 1; justify-content: center; }
  .btn.scegli { justify-content: flex-start; width: 100%; font: 700 clamp(.78em, 4.2cqi, .9em) ui-monospace, Menlo, monospace; text-align: left; }
  .btn.scegli span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn.scegli i { width: 1.3em; height: 1.3em; border-radius: 50%; background: var(--c); flex: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); }
  .aiuti { margin-top: .5em; display: grid; gap: .3em; }
  .aiuto { padding: .45em .65em; border: 1px solid rgba(255,183,3,.35); background: rgba(255,183,3,.07); border-radius: .5em; color: #ffd98a;
    font-family: ui-monospace, Menlo, monospace; font-size: clamp(.8em, 4cqi, .9em); line-height: 1.5; white-space: nowrap; overflow-x: auto; }
  .msg { margin: .55em 0 0; font-size: .9em; line-height: 1.45; text-wrap: pretty; }
  .msg:empty { display: none; }

  .piede { display: flex; flex-wrap: wrap; gap: .5em; margin-top: .9em; } .piede .btn { flex: 1; }
  .esito { margin-top: .7em; padding: .9em; border: 1px solid var(--ok); border-radius: calc(var(--u) * .8); text-align: center; background: rgba(61,220,151,.06); }
  .esito .stelle { display: flex; justify-content: center; gap: .3em; }

  .esito li::before { content: "○ "; color: var(--testo2); } .esito li.si::before { content: "★ "; color: var(--avviso); }
  .esito .riga { display: flex; flex-wrap: wrap; gap: .5em; } .esito .riga .btn { flex: 1; }
  .scheda-lab { display: grid; gap: .3em; padding: .7em; border: 1px solid var(--bordo); border-radius: calc(var(--u) * .8); background: #050506; }

  .eq { margin: .7em 0; padding: .7em; text-align: center; font: 800 clamp(1em, 6cqi, 1.35em) ui-monospace, Menlo, monospace; white-space: nowrap; overflow-x: auto; border-radius: calc(var(--u) * .8);
    background: #000; border: 1px solid var(--bordo); }
  details { border: 1px solid var(--bordo); border-radius: calc(var(--u) * .7); margin-bottom: .4em; background: #050506; }

  details > div { padding: 0 .7em .7em; font: .88em/1.6 ui-monospace, Menlo, monospace; color: var(--testo2); white-space: nowrap; overflow-x: auto; }
  h4 { margin: .9em 0 .4em; font-size: .9em; color: var(--testo2); text-transform: uppercase; letter-spacing: .06em; }

  #tastierino { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; padding: 6px calc(var(--u) * .7) 8px;

  else if (t.id === 'labF') lr.forza = +t.value;
  else if (t.dataset.lab) { const v = leggiNumero(t.value); if (v === null) return; if (t.dataset.lab === 'm') nuovaM = clamp(v, -20, 20); else lr.q = clamp(v, -50, 50); }
  else return;
  if (nuovaM !== null) { lr.m = nuovaM; if (S.stato === 'mira') rettaSullaBianca(); }   // m ruota la retta attorno alla bianca; q la sposta (con la bianca)
  controlliLab(); mostraRettaLab();
});
let ultimaTraiettoria = 0;
function aggiornaTraiettoria(prev) {
  const ora = performance.now(); if (ora - ultimaTraiettoria < 120) return; ultimaTraiettoria = ora;
  const el = document.getElementById('labTraiettoria'); if (!el) return;
  el.innerHTML = prev.segmenti.map((s, i) => {
    const eq = isFinite(s.m) ? `m ${numCirca(s.m)}` : 'verticale';
    const fine = i === prev.segmenti.length - 1 ? (prev.buca ? ' → in buca!' : prev.contatto ? ` → colpisce la ${prev.contatto.n}` : '') : ` → sponda in ${coordD(round1(s.a[0]), round1(s.a[1]))}`;
    return `<li>${eq}${fine}</li>`;
  }).join('');
}

// ───────────────────────────────────────────── HUD, AVVISI, ASPETTO
function aggiornaHud() {
  // due righe: dove sei (modalità, livello, tavolo del set) e come stai andando (stelle, punti, serie, turno, potenza)
  let r1, r2 = [];
  if (S.tab === 'lab') r1 = 'Lab · tiro libero';
  else {
    const set = setOra();
    r1 = `${{ tiro: 'Tiro', sponde: 'Sponde', effetto: 'Effetto' }[S.tab]} · ${S.sfida?.giorno ? 'sfida del giorno' : 'liv. ' + S.sfida?.livello}${set ? ` · tavolo ${tavoloN(set)}/${TAVOLI_SET}` : ''}`;
    r2.push(`★ ${stelleTotali()} · ${prog.punti.toLocaleString('it-IT')} pt`);
    if (prog.serie >= 2) r2.push(`<span class="serie">serie ×${fmt([1, 1, 1.2, 1.5, 2][Math.min(prog.serie, 4)], 1)}</span>`);
    if (S.giocatori === 2) r2.push(`<span class="turno">G1 ${S.punteggi[0]} · G2 ${S.punteggi[1]} · tocca a G${S.turno + 1}</span>`);
  }
  if (S.mira?.k > 0) r2.push(`potenza ${Math.round(S.mira.k * 100)}%`);
  let t = `<span class="r">${r1}</span>` + (r2.length ? `<span class="r">${r2.join(' · ')}</span>` : '');

}
function avviso(testoMsg, tipo = '', ms = 1800) {
  const a = $('avviso'); a.textContent = lega(testoMsg); a.className = tipo;
  clearTimeout(avviso.t); avviso.t = setTimeout(() => a.classList.add('nascosto'), ms);
}
function testoGrande(t) { const g = $('grande'); g.textContent = t; g.classList.remove('via'); void g.offsetWidth; g.classList.add('via'); }
function regola(g, hex) {   // slider tono e luce di un gruppo di colori
  const R = REGOLE[g], { h, l } = hexHsl(hex);
  return `<div class="regola" data-col="${g}"><label class="cursore due"><span>tono</span><input type="range" data-p="h" min="0" max="359" value="${Math.round(h)}" aria-label="Tono"></label>
    <label class="cursore due"><span>luce</span><input type="range" data-p="l" min="${R.l[0] * 100}" max="${R.l[1] * 100}" value="${Math.round(clamp(l, R.l[0], R.l[1]) * 100)}" aria-label="Luce"></label></div>`;
}
function renderAspetto() {
  const st = stelleTotali();
  const sw = (gruppo, lista, sel, swatch) => `<div class="campioni">${lista.map((x) => {
    const bloccato = x.stelle && st < x.stelle;

  }).join('')}</div>`;
  const seg = (gruppo, voci, sel) => `<div class="campioni">${voci.map(([v, nome]) => `<button class="sw" data-gruppo="${gruppo}" data-val="${v}" aria-pressed="${String(sel) === String(v)}">${nome}</button>`).join('')}</div>`;
  $('aspettoCorpo').innerHTML = `
    <h3>Tappeto</h3>${sw('tappeto', TAPPETI, asp.tappetoHex ? '' : asp.tappeto, (x) => `<i style="--c:${x.c}"></i>`)}${regola('tappeto', colorePanno())}
    <h3>Cornice</h3>${sw('cornice', CORNICI, asp.corniceHex ? '' : asp.cornice, (x) => `<i style="--c:${x.c}"></i>`)}${regola('cornice', coloreCornice())}
    <h3>Colore dell'interfaccia</h3>${sw('accento', ACCENTI, asp.accentoHex ? '' : asp.accento, (x) => `<i style="--c:${x.c}"></i>`)}${regola('accento', coloreAccento())}
    <h3>Neon del piano</h3><div class="campioni"><button class="sw" data-gruppo="neonReset" data-val="1" aria-pressed="${!asp.neonHex}"><i style="--c:${coloreAccento()}"></i>Come l'interfaccia</button></div>
    ${regola('neon', coloreNeon())}<label class="cursore due"><span>intensità</span><input type="range" data-forza min="0" max="150" step="5" value="${Math.round((asp.neonForza ?? 1) * 100)}" aria-label="Intensità del neon"></label>
    <h3>Palle</h3>${sw('set', SET_PALLE, asp.set, (x) => `<i class="multi" style="--c1:${x.c[0]};--c2:${x.c[1]};--c3:${x.c[2]};--c4:${x.c[5]}"></i>`)}
    <p class="nota">I set speciali si sbloccano con le stelle: brillano, lasciano scie e scintille, cambiano gli urti. Non cambiano il gioco.</p>
    <h3>Vibrazione</h3>${seg('vibrazione', [[0, 'Spenta'], [1, 'Leggera'], [2, 'Piena']], Aptica.livello)}
    <p class="nota">${Aptica.reale ? 'Questo dispositivo vibra davvero; in più senti e vedi la vibrazione "analogica".' : Aptica.ios ? 'Su iPhone e iPad senti dei tic leggeri al tocco; il resto è vibrazione analogica: un colpo sonoro grave e il tavolo che trema.' : 'Questo dispositivo non vibra: la vibrazione è analogica, un colpo sonoro grave e il tavolo che trema.'}</p>
    <h3>Giocatori</h3>${seg('giocatori', [[1, 'Uno'], [2, 'Due a turno']], S.giocatori)}
    <p class="nota">In due: chi sbaglia un calcolo passa il turno all'altro sullo stesso tavolo.</p>
    <h3>Schermo</h3>${seg('lim', [[0, 'Normale'], [1, 'LIM (testi grandi)']], stage.lim ? 1 : 0)}`;
}
$('aspettoCorpo').addEventListener('click', (e) => {
  const b = e.target.closest('.sw'); if (!b || b.disabled) return;
  const g = b.dataset.gruppo, v = b.dataset.val;
  Suono.clic();
  if (g === 'vibrazione') { Aptica.livello = +v; Aptica.vibra('giusto', 1, { el: $('aspetto'), gesto: true }); }
  else if (g === 'giocatori') { S.giocatori = +v; scrivi('orfini.pool.giocatori', S.giocatori); S.turno = 0; S.punteggi = [0, 0]; aggiornaHud(); }
  else if (g === 'lim') impostaLim(v === '1');
  else if (g === 'neonReset') { asp.neonHex = null; scrivi('orfini.pool.aspetto', asp); disegnaPianoEsteso(); }
  else {
    asp[g] = g === 'numero' ? +v : v; asp[g + 'Hex'] = null;   // un campione cancella il colore su misura del gruppo

  }

});
// slider dei colori: si ridisegna solo la parte che cambia, al massimo una volta per fotogramma
const daApplicare = new Set();
$('aspettoCorpo').addEventListener('input', (e) => {
  const t = e.target; if (t.type !== 'range') return;
  if (t.hasAttribute('data-forza')) { asp.neonForza = +t.value / 100; daApplicare.add('neon'); }
  else {
    const box = t.closest('.regola'), g = box.dataset.col, R = REGOLE[g];
    const h = +box.querySelector('[data-p="h"]').value, l = +box.querySelector('[data-p="l"]').value / 100;
    asp[g + 'Hex'] = hslHex(h, R.s, l); daApplicare.add(g);
    box.previousElementSibling?.querySelectorAll('.sw').forEach((b) => b.setAttribute('aria-pressed', 'false'));
  }
  if (daApplicare.size === 1) requestAnimationFrame(() => {
    for (const g of daApplicare) {
      if (g === 'tappeto') disegnaPanno();
      else if (g === 'cornice') applicaCornice();
      else if (g === 'neon') disegnaPianoEsteso();
      else if (g === 'accento') { document.documentElement.style.setProperty('--accento', coloreAccento()); applicaCornice(); disegnaPianoEsteso(); disegnaPalle(); aggiornaGrafica(); }
    }
    daApplicare.clear(); richiediRender();
  });
});
$('aspettoCorpo').addEventListener('change', (e) => { if (e.target.type === 'range') scrivi('orfini.pool.aspetto', asp); });
function applicaCornice() {
  const cor = CORNICI.find((c) => c.id === asp.cornice) || CORNICI[0];
  matCornice.color.set(coloreCornice()); matCornice.roughness = cor.rough; matCornice.metalness = cor.metal;
  stecca.userData.impugnatura.material.emissive.set(coloreAccento());
}
function applicaAspetto() {
  document.documentElement.style.setProperty('--accento', coloreAccento());
  applicaCornice(); disegnaPanno(); disegnaPianoEsteso(); disegnaPalle();
  aggiornaGrafica();
}
function chiudiAspetto() { $('aspetto').classList.add('nascosto'); $('bAspetto').setAttribute('aria-pressed', 'false'); }
$('chiudiAspetto').addEventListener('click', () => { Suono.clic(); chiudiAspetto(); });

// ───────────────────────────────────────────── COMANDI
function aggiornaIcone() {
  $('bVista').innerHTML = icona(S.vista === 'alto' ? 'vista' : 'alto'); $('bVista').setAttribute('aria-pressed', S.vista === 'inclinata');
  $('bLento').innerHTML = icona('lento'); $('bLento').setAttribute('aria-pressed', S.lento);
  $('bAspetto').innerHTML = icona('aspetto'); $('bMuto').innerHTML = icona(Suono.muto ? 'muto' : 'audio'); $('bFull').innerHTML = icona('full');
}
function impostaLim(v) {
  stage.lim = v; scrivi('orfini.lim', v);
  document.documentElement.toggleAttribute('data-lim', v);
  Suono.volumeBase = v ? 0.5 : 0.8;
  $('banner').classList.add('nascosto');
  chiediRidim();
}
const azioni = {
  vista() {
    S.vista = S.vista === 'alto' ? 'inclinata' : 'alto';
    disegnaPianoEsteso();
    if (S.vista === 'alto') { orbita.enabled = false; canvas.style.cursor = ''; cam.cur.tilt = 1; }
    else avviso('Vista 3D: trascina sul tavolo per inclinarlo e girarlo un po\'; per tirare parti dalla palla bianca.', '', 3200);
    aggiornaIcone(); adattaCamera();
  },
  lento() { S.lento = !S.lento; loop.timeScaleTarget = S.lento ? 0.25 : 1; aggiornaIcone(); },
  aspetto() { const v = $('aspetto').classList.toggle('nascosto'); $('bAspetto').setAttribute('aria-pressed', !v); if (!v) renderAspetto(); },
  muto() { Suono.setMuto(!Suono.muto); aggiornaIcone(); },
  async full() {
    const el = document.documentElement;
    try {
      if (!(document.fullscreenElement || document.webkitFullscreenElement)) await (el.requestFullscreen?.({ navigationUI: 'hide' }) ?? el.webkitRequestFullscreen?.());
      else await (document.exitFullscreen?.() ?? document.webkitExitFullscreen?.());
    } catch {}
  },
};
for (const [id, fn] of Object.entries({ bVista: 'vista', bLento: 'lento', bAspetto: 'aspetto', bMuto: 'muto', bFull: 'full' }))
  $(id).addEventListener('click', () => { Suono.clic(); azioni[fn](); });
if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) $('bFull').classList.add('nascosto');
let wakeLock = null;
async function teniAcceso() { try { if (!wakeLock || wakeLock.released) wakeLock = await navigator.wakeLock?.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { Suono.ctx?.suspend(); Aptica.ferma(); }
  else { loop.ultimo = 0; loop.acc = 0; Suono.ctx?.resume(); if (avviato) teniAcceso(); }
});

// ───────────────────────────────────────────── CICLO PRINCIPALE
function sync(alpha) {
  for (const p of palle) {
    const { mesh, ombra } = MESH[p.n];
    mesh.visible = p.visibile;
    if (!p.visibile) { ombra.visible = false; continue; }
    const x = lerp(p.px, p.x, alpha), y = lerp(p.py, p.y, alpha), z = lerp(p.pz, p.z, alpha);
    mesh.position.set(x, z, -y); mesh.quaternion.copy(p.q);
    ombra.visible = z > 0; ombra.position.set(x + 0.06, 0.004, -y + 0.05); ombra.material.opacity = clamp(z / T.r, 0, 1);
  }
  for (const p of palle) {
    const s = SCIE[p.n], n = s.punti.length;
    if (n < 2) { s.l.visible = false; continue; }
    const pos = s.l.geometry.attributes.position, col = s.l.geometry.attributes.color;
    _c.set(p.n === 0 ? coloreAccento() : colorePalla(p.n));
    for (let i = 0; i < n; i++) {
      const [x, y, z] = s.punti[i], f = (i / (n - 1)) * 0.8;
      pos.setXYZ(i, x, Math.max(0.03, z * 0.3), -y); col.setXYZ(i, _c.r * f, _c.g * f, _c.b * f);
    }
    pos.needsUpdate = col.needsUpdate = true; s.l.geometry.setDrawRange(0, n); s.l.visible = true;
  }
}
const debug = $('debug');
if (DEBUG) debug.classList.remove('nascosto');
let hudAgg = 0;
function frame(ora) {
  requestAnimationFrame(frame);
  const dt = Math.min(ora - (loop.ultimo || ora), 100); loop.ultimo = ora;
  loop.fps += ((dt > 0 ? 1000 / dt : 60) - loop.fps) * 0.05;
  loop.timeScale += (loop.timeScaleTarget - loop.timeScale) * 0.15;
  let attivo = false;
  const inMoto = S.stato === 'tiro' || S.stato === 'replay';
  if (!loop.inPausa && (inMoto || palle.some((p) => p.caduta && !p.caduta.fine))) {
    attivo = true;
    if (ora >= loop.hitStopFino) {
      loop.acc += dt * loop.timeScale;
      let n = 0;
      while (loop.acc >= STEP && n < 5) { if (S.stato === 'replay') passoReplay(); else passoFisico(); loop.acc -= STEP; n++; }
      if (n === 5) loop.acc = 0;
    }
    if (S.stato === 'tiro' && tuttoFermo()) concludiTiro();
  } else loop.acc = 0;
  loop.alpha = (S.stato === 'tiro' || S.stato === 'replay') ? loop.acc / STEP : 1;
  if (spazio && S.mira) {   // carica da tastiera: 1,2 s per la potenza piena
    S.mira.k = clamp((ora - spazio) / 1200, 0, 1);
    const tic = Math.floor(S.mira.k * 8); if (tic !== S.mira.ultimoTic) { S.mira.ultimoTic = tic; Suono.carica(S.mira.k); }
    aggiornaGuida();
  }
  if (fx.aggiorna(dt / 1000 * loop.timeScale)) attivo = true;
  if (orbita.enabled) { if (orbita.update()) attivo = true; }
  else if (muoviCamera()) attivo = true;
  else if (S.vista === 'inclinata' && S.stato !== 'replay') attivaOrbita();
  if (fx.trauma > 0 && !orbita.enabled) {
    attivo = true; fx.trauma = Math.max(0, fx.trauma - dt / 1000 * 1.6);
    const s = fx.trauma * fx.trauma * 0.35;
    shakeOff.set(s * (Math.sin(ora * 0.091) + Math.sin(ora * 0.047)) / 2, 0, s * (Math.sin(ora * 0.073) + Math.sin(ora * 0.031)) / 2);
  } else shakeOff.set(0, 0, 0);
  if (!attivo && !sporco) return;
  sporco = false;
  if (attivo) quality.campiona(dt, ora);
  if (orbita.enabled) { camera.setViewOffset(stage.cssW, stage.cssH, -cam.tgt.ox, -cam.tgt.oy, stage.cssW, stage.cssH); camera.updateMatrixWorld(); }
  else applicaCamera();
  sync(loop.alpha);
  particelle.material.uniforms.uScala.value = stage.cssH * stage.dpr / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  if (usaBloom()) composer.render(); else renderer.render(scene, camera);
  posizionaEtichette();
  if (S.mira) { const P = palle[0], sp = cartASchermo(P.x, P.y), c = $('carica'); c.style.left = sp.x + 'px'; c.style.top = sp.y + 'px'; }
  if (S.tab === 'lab' && S.stato === 'tiro' && ora - hudAgg > 150) { hudAgg = ora; aggiornaLab(); }
  if (!debug.classList.contains('nascosto')) debug.textContent =
    `fps ${loop.fps.toFixed(0)}  frame ${quality.ema.toFixed(1)} ms\nqualità ${quality.livello}  dpr ${stage.dpr.toFixed(2)}  bloom ${usaBloom()}\ncanvas ${canvas.width}×${canvas.height}\npalle ${palle.length}  draw ${renderer.info.render.calls}  profilo ${stage.profilo}${stage.lim ? ' LIM' : ''}  ${layout}`;
}

// ───────────────────────────────────────────── AVVIO
impostaLim(Q.has('lim') || leggi('orfini.lim', false));
if (stage.profilo === 'lim?' && !stage.lim && !leggi('orfini.limChiesto', false)) $('banner').classList.remove('nascosto');
$('bannerSi').addEventListener('click', () => { impostaLim(true); scrivi('orfini.limChiesto', true); });
$('bannerNo').addEventListener('click', () => { scrivi('orfini.limChiesto', true); $('banner').classList.add('nascosto'); });
document.documentElement.style.setProperty('--accento', coloreAccento());
applicaCornice(); disegnaPanno(); disegnaPianoEsteso(); disegnaPalle();
ridimensiona();
if (S.tab === 'lab') nuovoLab(); else nuovaSfida();
renderPannello();
aggiornaIcone();
$('msgAvvio').innerHTML = 'Il piano cartesiano è stampato sul panno.<br><b>Tiro</b>: calcola la retta che porta la palla in buca.<br><b>Sponde</b>: usa pendenze e simmetrie per rimbalzare.<br><b>Effetto</b>: la palla curva lungo una parabola.<br><b>Lab</b>: gioca libero e guarda le rette.<br>Ogni livello è un <b>set di ' + TAVOLI_SET + ' tavoli</b>: mandali tutti in buca per sbloccare il successivo.<br>Per tirare tieni il dito sul tavolo e trascina all\'indietro, come una fionda.';
$('bGioca').classList.remove('nascosto');
$('bGioca').addEventListener('click', () => { Suono.avvia(); Suono.clic(); $('schermata').classList.add('nascosto'); teniAcceso(); adattaCamera(); renderPannello(); });
$('bGioca').focus();
if (DEBUG) window.__orfini = {
  S, T, FIS, BUCHE, prog, sets, TAVOLI_SET, Aptica, loop, THREE, camera, orbita, get palle() { return palle; },
  tira, passoFisico, tuttoFermo, concludiTiro, cambiaTab, nuovaSfida, renderPannello, verificaPasso, direzioneAlgebrica, prevedi, scegliPalla, profiloTiro, cam, mostraRettaLab, asp, MESH, fx, pianoEsteso, contorno, renderAspetto, stelleTotali,
  avanzaFinoAFermo(max = 4000) { let n = 0; while (S.stato === 'tiro' && n < max) { passoFisico(); n++; if (tuttoFermo()) { concludiTiro(); break; } } return n; },
};
// ───────────────────────────────────────────── SPIEGAMI (spiegazione animata in una finestra sopra il gioco)
// scena: '' = tutta l'animazione, oppure 'tiro' | 'scelta' | 'sponde' | 'lab'
function openExplainer(scena = '') {
  $('explainFrame').src = 'math_pool_retta_pianocartesiano_spiegazione.html?embed=1' + (scena ? '#' + scena : '');

}

}

$('explain').addEventListener('click', (e) => { if (e.target.id === 'explain') closeExplainer(); });
addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('explain').hidden) closeExplainer(); });
addEventListener('message', (e) => {   // a fine scena si torna al gioco da soli
  if (e.origin === location.origin && e.data && e.data.type === 'spiegazione-finita') setTimeout(closeExplainer, 1500);
});
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-explain]'); if (!b) return;
  Suono.clic();
  openExplainer(b.dataset.explain === 'mode' ? (S.tab === 'tiro' && S.sfida?.dati?.scelta ? 'scelta' : S.tab) : b.dataset.explain);
});
avviato = true;
requestAnimationFrame(frame);
