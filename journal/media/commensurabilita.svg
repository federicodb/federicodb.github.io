<svg width="620" height="262" class="sc-fig" viewBox="0 0 620 262" role="img" aria-label="Commensurabilità: una tacca comune misura 15 e 20; lato e diagonale del quadrato non ne hanno" xmlns="http://www.w3.org/2000/svg"><title>Commensurabilità: una tacca comune misura 15 e 20; lato e diagonale del quadrato non ne hanno</title><text x="20.0" y="22.0" font-size="13" text-anchor="start" fill="#0b7285" font-weight="700" font-family="Inter, sans-serif">una tacca comune</text><text x="98.0" y="51.0" font-size="13" text-anchor="end" fill="#1b1b1b" font-weight="700" font-family="Inter, sans-serif">A = 15</text><rect x="110.0" y="36.0" width="73.3" height="20.0" fill="rgba(11,114,133,0.13)" stroke="#1b1b1b" stroke-width="1.2"/><rect x="183.3" y="36.0" width="73.3" height="20.0" fill="none" stroke="#1b1b1b" stroke-width="1.2"/><rect x="256.7" y="36.0" width="73.3" height="20.0" fill="rgba(11,114,133,0.13)" stroke="#1b1b1b" stroke-width="1.2"/><text x="340.0" y="51.0" font-size="12" text-anchor="start" fill="#c2410c" font-weight="600" font-family="Inter, sans-serif">3 tacche</text><text x="98.0" y="85.0" font-size="13" text-anchor="end" fill="#1b1b1b" font-weight="700" font-family="Inter, sans-serif">B = 20</text><rect x="110.0" y="70.0" width="73.3" height="20.0" fill="rgba(11,114,133,0.13)" stroke="#1b1b1b" stroke-width="1.2"/><rect x="183.3" y="70.0" width="73.3" height="20.0" fill="none" stroke="#1b1b1b" stroke-width="1.2"/><rect x="256.7" y="70.0" width="73.3" height="20.0" fill="rgba(11,114,133,0.13)" stroke="#1b1b1b" stroke-width="1.2"/><rect x="330.0" y="70.0" width="73.3" height="20.0" fill="none" stroke="#1b1b1b" stroke-width="1.2"/><text x="413.3" y="85.0" font-size="12" text-anchor="start" fill="#c2410c" font-weight="600" font-family="Inter, sans-serif">4 tacche</text><text x="20.0" y="120.0" font-size="12.5" text-anchor="start" fill="#333" font-weight="400" font-family="Inter, sans-serif">tacca = 5 = MCD(15, 20)</text><rect x="30.0" y="140.0" width="178.0" height="48.0" fill="none" stroke="#0b7285" stroke-width="1.3"/><text x="119.0" y="159.0" font-size="12" text-anchor="middle" fill="#0b7285" font-weight="700" font-family="Inter, sans-serif">frazione</text><text x="119.0" y="178.0" font-size="13.5" text-anchor="middle" fill="#1b1b1b" font-weight="600" font-family="Inter, sans-serif">A è 3/4 di B</text><rect x="220.0" y="140.0" width="178.0" height="48.0" fill="none" stroke="#0b7285" stroke-width="1.3"/><text x="309.0" y="159.0" font-size="12" text-anchor="middle" fill="#0b7285" font-weight="700" font-family="Inter, sans-serif">numero razionale</text><text x="309.0" y="178.0" font-size="13.5" text-anchor="middle" fill="#1b1b1b" font-weight="600" font-family="Inter, sans-serif">3 : 4 = 0,75</text><rect x="30.0" y="198.0" width="178.0" height="48.0" fill="none" stroke="#0b7285" stroke-width="1.3"/><text x="119.0" y="217.0" font-size="12" text-anchor="middle" fill="#0b7285" font-weight="700" font-family="Inter, sans-serif">proporzione</text><text x="119.0" y="236.0" font-size="13.5" text-anchor="middle" fill="#1b1b1b" font-weight="600" font-family="Inter, sans-serif">3 : 4 = 15 : 20</text><rect x="220.0" y="198.0" width="178.0" height="48.0" fill="none" stroke="#0b7285" stroke-width="1.3"/><text x="309.0" y="217.0" font-size="12" text-anchor="middle" fill="#0b7285" font-weight="700" font-family="Inter, sans-serif">percentuale</text><text x="309.0" y="236.0" font-size="13.5" text-anchor="middle" fill="#1b1b1b" font-weight="600" font-family="Inter, sans-serif">3/4 = 75/100 = 75%</text><text x="543.0" y="22.0" font-size="13" text-anchor="middle" fill="#c2410c" font-weight="700" font-family="Inter, sans-serif">nessuna tacca comune</text><rect x="488.0" y="70.0" width="110.0" height="110.0" fill="none" stroke="#1b1b1b" stroke-width="1.4"/><line x1="488.0" y1="180.0" x2="598.0" y2="70.0" stroke="#c2410c" stroke-width="2.4"/><text x="543.0" y="198.0" font-size="12" text-anchor="middle" fill="#1b1b1b" font-weight="400" font-family="Inter, sans-serif">lato 1</text><text x="557.0" y="119.0" font-size="15" text-anchor="start" fill="#c2410c" font-weight="700" font-family="Inter, sans-serif">√2</text><line x1="503.7" y1="175.0" x2="503.7" y2="185.0" stroke="#1b1b1b" stroke-width="1"/><line x1="519.4" y1="175.0" x2="519.4" y2="185.0" stroke="#1b1b1b" stroke-width="1"/><line x1="535.1" y1="175.0" x2="535.1" y2="185.0" stroke="#1b1b1b" stroke-width="1"/><line x1="550.9" y1="175.0" x2="550.9" y2="185.0" stroke="#1b1b1b" stroke-width="1"/><line x1="566.6" y1="175.0" x2="566.6" y2="185.0" stroke="#1b1b1b" stroke-width="1"/><line x1="582.3" y1="175.0" x2="582.3" y2="185.0" stroke="#1b1b1b" stroke-width="1"/><text x="543.0" y="224.0" font-size="12" text-anchor="middle" fill="#333" font-weight="400" font-family="Inter, sans-serif">lato e diagonale:</text><text x="543.0" y="240.0" font-size="12.5" text-anchor="middle" fill="#c2410c" font-weight="700" font-family="Inter, sans-serif">incommensurabili</text><text x="543.0" y="258.0" font-size="12" text-anchor="middle" fill="#333" font-weight="400" font-family="Inter, sans-serif">→ √2, π, φ irrazionali</text></svg>