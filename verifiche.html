<!DOCTYPE html>
<html lang="it" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Archivio Verifiche | Orfini Math Lab</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Amatic+SC:wght@700&family=Caveat:wght@700&family=Cinzel:wght@700&family=Oswald:wght@500&family=Permanent+Marker&family=Playfair+Display:ital,wght@1,600&family=Press+Start+2P&family=Righteous&family=Space+Mono:ital,wght@0,700;1,700&family=Inter:wght@400;700&family=Syne:wght@700;800&display=swap"
        rel="stylesheet">

    <!-- Polyfill per Import Maps (Compatibilità Safari < 16.4 / iOS < 16.4) -->
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.8.2/dist/es-module-shims.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="database_verifiche.js?v=2"></script>

    <style>
        :root {
            --primary: #00bcd4;
            --secondary: #ff4081;
            --bg-dark: #050510;
            --glass: rgba(10, 20, 40, 0.75);
            --glass-solid: rgba(10, 20, 40, 0.95);
            --border: rgba(255, 255, 255, 0.1);
            --font-ui: 'Inter', sans-serif;
        }

        /* --- 3D TAG FONTS --- */
        .font-1 { font-family: 'Caveat', cursive !important; font-size: 1.3em; }
        .font-2 { font-family: 'Space Mono', monospace !important; font-weight: 700; }
        .font-3 { font-family: 'Abril Fatface', serif !important; }
        .font-4 { font-family: 'Permanent Marker', cursive !important; transform: rotate(-2deg); }
        .font-5 { font-family: 'Righteous', cursive !important; }
        .font-6 { font-family: 'Cinzel', serif !important; font-weight: 700; }
        .font-7 { font-family: 'Amatic SC', cursive !important; font-size: 1.5em; font-weight: 700; }
        .font-8 { font-family: 'Oswald', sans-serif !important; text-transform: uppercase; }
        .font-9 { font-family: 'Press Start 2P', cursive !important; font-size: 0.7em; color: #0f0; }
        .font-10 { font-family: 'Playfair Display', serif !important; font-style: italic; }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            overflow-x: hidden;
            background: var(--bg-dark);
            font-family: var(--font-ui);
            color: white;
            width: 100vw;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch; /* Momentum scrolling iOS */
        }

        /* --- NAVIGATION --- */
        #main-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--glass-solid);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
        }

        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .brand-container {
            display: flex;
            flex-direction: column;
        }

        .brand-orfini {
            font-family: 'Syne', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1;
            color: #fff;
            text-transform: uppercase;
        }

        .brand-sub {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            color: var(--primary);
            letter-spacing: 0.25em;
            margin-top: 0.2rem;
        }

        .nav-links {
            display: flex;
            align-items: stretch;
            flex: 1;
            justify-content: center;
            gap: 0;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .nav-tab {
            background: transparent;
            border: none;
            border-right: 1px solid var(--border);
            color: #888;
            font-family: var(--font-ui);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            padding: 0.7rem 1.2rem;
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-tab:last-child { border-right: none; }

        .nav-tab:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-tab.active {
            background: #fff !important;
            color: #000 !important;
        }

        .nav-search {
            flex-shrink: 0;
            position: relative;
        }

        #search-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: white;
            padding: 0.8rem 1.2rem 0.8rem 2.8rem;
            border-radius: 12px;
            outline: none;
            font-size: 0.95rem;
            width: 280px;
            transition: all 0.3s;
            font-family: var(--font-ui);
        }

        #search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 188, 212, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: #888;
            pointer-events: none;
        }

        /* --- HERO SECTION --- */
        #hero {
            position: relative;
            height: clamp(250px, 40vh, 500px);
            width: 100%;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
            background: #000;
        }

        #scene-container {
            position: absolute;
            inset: 0;
            z-index: 0;
            outline: none;
            touch-action: none;
        }

        /* --- GRID & CARDS --- */
        #main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 4rem 2rem;
            min-height: 50vh;
        }

        .list-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
            gap: 32px;
            width: 100%;
        }

        .project-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 32px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 400px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .project-card:focus-within {
            outline: 2px solid var(--primary);
            outline-offset: 4px;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.05);
        }

        @media (hover: hover) and (pointer: fine) {
            .project-card:hover {
                border-color: var(--primary);
                transform: translateY(-5px);
                background: rgba(255, 255, 255, 0.05);
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            }
            .project-card:hover .card-cta {
                background: var(--primary);
                color: #000;
                border-color: var(--primary);
            }
        }

        .card-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            filter: blur(20px) saturate(0.5);
            opacity: 0.1;
            background-size: cover;
            background-position: center;
            transition: opacity 0.6s, filter 0.6s;
        }
        
        .card-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(5,5,15,0.4) 0%, rgba(5,5,15,0.9) 100%);
            z-index: 1;
            transition: opacity 0.4s;
        }

        .project-card:hover .card-bg {
            opacity: 0.2;
            filter: blur(5px) saturate(0.8);
        }

        .card-content-wrap {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        .card-date { font-size: 0.8rem; color: #888; font-family: 'Space Mono', monospace; }
        .project-card h3 { font-family: var(--font-ui); font-size: 1.4rem; font-weight: 800; margin: 0.8rem 0; color: #fff; line-height: 1.1; }
        .project-card p { font-size: 0.9rem; line-height: 1.5; color: #ccc; flex-grow: 1; margin: 0.8rem 0 1.5rem 0; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
        .card-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
        .filter-tag { font-family: 'Space Mono', monospace; font-size: 0.65rem; padding: 6px 12px; background: rgba(255, 255, 255, 0.05); color: #aaa; border: 1px solid rgba(255,255,255,0.1); border-radius: 50px; cursor: pointer; transition: all 0.2s; position: relative; z-index: 5; }
        .filter-tag:hover { background: var(--primary); color: #000; border-color: var(--primary); }
        
        .badge-institutional { background: rgba(79, 70, 229, 0.15) !important; color: #a5b4fc !important; border: 1px solid rgba(79, 70, 229, 0.4) !important; }
        .badge-class { background: rgba(217, 119, 6, 0.15) !important; color: #fbbf24 !important; border: 1px solid rgba(217, 119, 6, 0.4) !important; font-weight: 700; font-size: 0.75rem !important; }

        .card-cta {
            display: block;
            width: 100%;
            padding: 0.8rem;
            text-align: center;
            background: transparent;
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 1;
        }

        /* --- OVERLAYS --- */
        .overlay-full {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(5, 5, 15, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .overlay-full.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .tag-content {
            display: inline-block;
            font-weight: 700;
            color: white;
            padding: 4px 8px;
            white-space: nowrap;
            cursor: pointer;
            pointer-events: auto;
            will-change: transform, opacity;
            transition: color 0.2s;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        @media (max-width: 768px) {
            .nav-content { flex-direction: column; align-items: stretch; gap: 1rem; }
            .nav-links { overflow-x: auto; padding-bottom: 0.5rem; justify-content: flex-start; scrollbar-width: none; }
            .nav-links::-webkit-scrollbar { display: none; }
            #search-input { width: 100%; }
        }
    </style>
</head>

<body>

    <nav id="main-nav">
        <div class="nav-content">
            <div class="brand-container">
                <div class="brand-orfini">ORFINI</div>
                <div class="brand-sub">ARCHIVIO VERIFICHE</div>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-tab">← Home</a>
                <a href="competenze.html" class="nav-tab">Riforma 2017</a>
                <button class="nav-tab active" data-category="all">Tutte</button>
                <button class="nav-tab" data-category="document">PDF</button>
            </div>
            <div class="nav-search">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" placeholder="Cerca verifiche, classi, argomenti..." aria-label="Cerca contenuti">
            </div>
        </div>
    </nav>

    <main id="main-content" style="padding-top: 2rem;">
        <div style="margin-bottom: 3rem; text-align: center;">
            <h1 style="font-family: 'Syne', sans-serif; font-size: 3rem; margin-bottom: 0.5rem; background: linear-gradient(90deg, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Archivio Verifiche</h1>
            <p style="color: #888; font-family: 'Space Mono', monospace; font-size: 0.9rem;">Consultazione dinamica e download delle prove strutturate</p>
        </div>
        <div class="list-grid" id="full-list-grid" role="region" aria-live="polite"></div>
    </main>

    <div id="media-modal" class="overlay-full">
        <div id="modal-box" style="width:95%; max-width:1100px; margin: auto;"></div>
    </div>

    <script type="module">
        import { UIManager } from './content/assets/js/modules/UIManager.js?v=7';

        window.addEventListener('load', () => {
            // Fix visibilità variabile globale db_verifiche definita in database_verifiche.js via script tag
            const data = (typeof db_verifiche !== 'undefined') ? db_verifiche : [];
            
            const initApp = () => {
                try {
                    // Inizializza solo la UI, senza la galassia 3D
                    const ui = new UIManager(data, null);

                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape') ui.closeModal();
                    });

                    const modal = document.getElementById('media-modal');
                    modal.onclick = () => ui.closeModal();
                    document.getElementById('modal-box').onclick = (e) => e.stopPropagation();
                } catch (err) {
                    console.error("Archive Init Failure:", err);
                }
            };

            if (typeof katex === 'undefined') {
                let attempts = 0;
                const checkKatex = setInterval(() => {
                    attempts++;
                    if (typeof katex !== 'undefined' || attempts > 30) {
                        clearInterval(checkKatex);
                        initApp();
                    }
                }, 50);
            } else {
                initApp();
            }
        });
    </script>
</body>

</html>
