<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Syne:wght@700;800&family=Space+Mono&display=swap" rel="stylesheet">
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

    <!-- Project Styles -->
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <nav id="main-nav">
        <div class="container nav-container">
            <div class="nav-row-1">
                <a href="index.html" class="brand">
                    <span class="brand-title">ORFINI</span>
                    <span class="brand-sub">LABORATORIO</span>
                </a>

                <div class="nav-links">
                    <a href="index.html" class="nav-link active">Journal</a>
                    <a href="verifiche.html" class="nav-link">Archivio</a>
                    <a href="galaxy.html" class="nav-link">Mappa</a>
                    <a href="competenze.html" class="nav-link">Competenze</a>
                    <a href="#about" id="about-link" class="nav-link">Chi Sono</a>
                </div>
            </div>

            <div class="nav-row-2">
                <div class="search-container">
                    <input type="text" id="search-input" class="search-input" placeholder="Cerca temi o competenze...">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y2="21" x2="16.65" y1="16.65"></line></svg>
                </div>
            </div>

            </div>
        </div>
    </nav>



    <main class="container">
        
        
        <!-- Interactive Search Banner -->
        <div class="filter-banner" id="active-filter-banner">
            <div>Filtro esplorativo attivo su: <strong id="active-filter-label"></strong></div>
            <span class="filter-close" onclick="window.clearGlobalFilter()">Azzera ✕</span>
        </div>

        <div class="content-grid" id="main-grid" role="region" aria-live="polite">
            <!-- Journal Cards will be injected here -->
        </div>
    </main>

    <div id="modal-overlay" class="modal-overlay">
        <div id="modal-content" class="modal-content"></div>
    </div>

    <footer class="site-footer">
        <div class="container">
            <div class="footer-top">
                <div class="brand">
                    <span class="brand-title">ORFINI MATH LAB</span>
                    <p>Laboratorio Permanente di Matematica e Fisica<br>Istituto Professionale "E. Orfini" Foligno</p>
                </div>
                <div class="footer-social">
                    <a href="https://instagram.com/meltingmath" target="_blank" class="social-circle" title="Instagram">
                        <svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
                    </a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 Prof. Federico DB. Realizzato con strumenti Open Source per una didattica inclusiva.</p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="database.js"></script>
    <script type="module">
        import { UIManager } from './content/assets/js/modules/UIManager.js';

        window.addEventListener('load', () => {
            const initApp = () => {
                try {
                    const ui = new UIManager(db);
                    window.appUI = ui;
                    
                    const appItems = db.filter(item => item.type === 'app');
                    // Chi Sono Modal
                    const aboutBtn = document.getElementById('about-link');
                    const openAbout = (e) => {
                        if (e) e.preventDefault();
                        const bio = `
                            <div class="bio-modal-content" style="color: var(--text-main); line-height: 1.8; max-width: 600px; margin: 0 auto; padding: 20px;">
                                <div style="text-align: center; margin-bottom: 30px;">
                                    <h2 style="font-family: var(--font-heading); font-size: 2.8rem; color: var(--primary); margin-bottom: 10px;">Federico DB</h2>
                                    <p style="font-family: 'Space Mono', monospace; font-size: 0.9rem; letter-spacing: 2px; opacity: 0.7;">INNOVAZIONE DIDATTICA / MATEMATICA (A026)</p>
                                </div>
                                
                                <div style="font-size: 1.1rem; margin-bottom: 25px;">
                                    <p style="margin-bottom: 20px;">
                                        Sono un docente impegnato nella ricerca di nuove strade per l'insegnamento della <strong>Matematica (classe A026)</strong>. Nel laboratorio dell'Istituto "E. Orfini" di Foligno, sperimento metodologie basate sulla <strong>didattica laboratoriale</strong> e il <strong>costruttivismo</strong>.
                                    </p>
                                    <p style="margin-bottom: 20px;">
                                        Utilizzo la <strong>visualizzazione</strong> e la <strong>gamification</strong> come strumenti chiave per un'istruzione inclusiva, che permetta a ogni studente di esplorare concetti complessi in modo intuitivo.
                                    </p>
                                    <p style="margin-bottom: 20px;">
                                        Ritengo fondamentale la filosofia <strong>Open Source</strong> perché garantisce a tutti l'accesso libero agli strumenti della conoscenza, senza barriere economiche o tecnologiche, favorendo la condivisione e la crescita collettiva.
                                    </p>
                                    <p style="margin-bottom: 30px;">
                                        <a href="https://instagram.com/meltingmath" target="_blank" style="color: var(--primary); text-decoration: none; border-bottom: 1px solid var(--primary); padding-bottom: 2px;">@meltingmath</a> è il mio profilo scolastico: il diario della sperimentazione quotidiana tra tecnologia, coding e design.
                                    </p>
                                </div>

                                <div style="display: flex; gap: 15px; justify-content: center;">
                                    <a href="https://instagram.com/meltingmath" target="_blank" class="btn-primary" style="display: inline-block; text-decoration: none; padding: 12px 25px; border-radius: 30px; background: var(--primary); color: white; font-weight: bold;">Segui il Progetto</a>
                                    <button onclick="window.appUI.closeModal()" class="chip" style="background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); padding: 12px 25px; border-radius: 30px; color: white; cursor: pointer;">Chiudi</button>
                                </div>
                            </div>
                        `;
                        const modal = document.getElementById('modal-overlay');
                        const content = document.getElementById('modal-content');
                        content.innerHTML = bio;
                        modal.classList.add('active');
                        document.body.style.overflow = 'hidden';
                    };

                    if (aboutBtn) aboutBtn.onclick = openAbout;
                    if (window.location.hash === '#about') openAbout();

                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape') ui.closeModal();
                    });

                    document.getElementById('modal-overlay').onclick = (e) => {
                        if (e.target === document.getElementById('modal-overlay')) {
                            ui.closeModal();
                        }
                    };

                } catch (err) {
                    console.error("UI Init Error:", err);
                }
            };



            // Global Filter Logic (callable both from Quick Filters and Card Chips)
            window.setGlobalFilter = (tag) => {
                const banner = document.getElementById('active-filter-banner');
                const label = document.getElementById('active-filter-label');
                const searchInput = document.getElementById('search-input');
                
                searchInput.value = tag;
                window.appUI.setFilter('search', tag);
                
                label.textContent = tag;
                banner.classList.add('active');
                window.scrollTo({ top: Math.max(0, banner.offsetTop - 120), behavior: 'smooth' });
            };
            
            window.clearGlobalFilter = () => {
                document.getElementById('active-filter-banner').classList.remove('active');
                document.getElementById('search-input').value = '';
                window.appUI.setFilter('search', '');
            };

            initApp();
        });
    </script>
</body>
</html>
