<!DOCTYPE html>
<html lang="it" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Laboratorio Matematico Orfini | Immersive Hub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Amatic+SC:wght@700&family=Caveat:wght@700&family=Cinzel:wght@700&family=Oswald:wght@500&family=Permanent+Marker&family=Playfair+Display:ital,wght@1,600&family=Press+Start+2P&family=Righteous&family=Space+Mono:ital,wght@0,700;1,700&family=Inter:wght@400;700&family=Syne:wght@700;800&display=swap"
        rel="stylesheet">

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script>
        window.addEventListener('load', () => {
            if (typeof katex === 'undefined') {
                console.error("[MathEngine] CRITICAL: KaTeX library failed to load from CDN.");
            } else {
                console.log("[MathEngine] KaTeX Ready.");
            }
        });
    </script>
    <script src="database.js?v=4"></script>
    <script src="database_verifiche.js?v=4"></script>

    <style>
        :root {
            --primary: #00bcd4;
            --secondary: #ff4081;
            --bg-dark: #050510;
            --glass: rgba(10, 20, 40, 0.75);
            --glass-solid: rgba(10, 20, 40, 0.95);
            --border: rgba(255, 255, 255, 0.1);
            --font-ui: 'Inter', sans-serif;
        }

        /* --- 3D TAG FONTS --- */
        .font-1 {
            font-family: 'Caveat', cursive !important;
            font-size: 1.3em;
        }

        .font-2 {
            font-family: 'Space Mono', monospace !important;
            letter-spacing: -0.05em;
            font-weight: 700;
        }

        .font-3 {
            font-family: 'Abril Fatface', serif !important;
        }

        .font-4 {
            font-family: 'Permanent Marker', cursive !important;
            transform: rotate(-2deg);
        }

        .font-5 {
            font-family: 'Righteous', cursive !important;
        }

        .font-6 {
            font-family: 'Cinzel', serif !important;
            font-weight: 700;
        }

        .font-7 {
            font-family: 'Amatic SC', cursive !important;
            font-size: 1.5em;
            font-weight: 700;
        }

        .font-8 {
            font-family: 'Oswald', sans-serif !important;
            text-transform: uppercase;
        }

        .font-9 {
            font-family: 'Press Start 2P', cursive !important;
            font-size: 0.7em;
            color: #0f0;
        }

        .font-10 {
            font-family: 'Playfair Display', serif !important;
            font-style: italic;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            overflow-x: hidden;
            background: var(--bg-dark);
            font-family: var(--font-ui);
            color: white;
            width: 100vw;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
            scroll-behavior: smooth;
        }

        /* --- NAVIGATION --- */
        #main-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--glass-solid);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
        }

        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .brand-container {
            display: flex;
            flex-direction: column;
        }

        .brand-orfini {
            font-family: 'Syne', sans-serif;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1;
            color: #fff;
            text-transform: uppercase;
        }

        .brand-sub {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            color: var(--primary);
            letter-spacing: 0.25em;
            margin-top: 0.2rem;
        }

        .nav-links {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex: 1;
            justify-content: center;
        }

        .nav-tab {
            background: transparent;
            border: none;
            color: #bbb;
            font-family: var(--font-ui);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav-tab:hover, .nav-tab:focus-visible {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
            outline: none;
        }

        .nav-tab.active {
            color: var(--primary);
            background: rgba(0, 188, 212, 0.1);
        }

        .nav-search {
            flex-shrink: 0;
            position: relative;
        }

        #search-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: white;
            padding: 0.8rem 1.2rem 0.8rem 2.8rem;
            border-radius: 12px;
            outline: none;
            font-size: 0.95rem;
            width: 280px;
            transition: all 0.3s;
            font-family: var(--font-ui);
        }

        #search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 188, 212, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            stroke: #888;
            pointer-events: none;
        }

        /* --- HERO SECTION --- */
        #hero {
            position: relative;
            height: clamp(250px, 40vh, 500px);
            width: 100%;
            overflow: hidden;
            border-bottom: 1px solid var(--border);
            background: #000;
        }

        #scene-container {
            position: absolute;
            inset: 0;
            z-index: 0;
            outline: none;
            touch-action: none;
        }

        /* --- RIMOSSA HERO OVERLAY, VISIONE E MANIFESTO (Design pulito) --- */

        /* --- GRID & CARDS --- */
        #main-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 4rem 2rem;
            min-height: 50vh;
        }

        .list-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
            gap: 24px;
            width: 100%;
        }

        .project-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 350px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
        }

        .project-card:focus-within {
            outline: 2px solid var(--primary);
            outline-offset: 4px;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.05);
        }

        @media (hover: hover) and (pointer: fine) {
            .project-card:hover {
                border-color: var(--primary);
                transform: translateY(-5px);
                background: rgba(255, 255, 255, 0.05);
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            }
            .project-card:hover .card-cta {
                background: var(--primary);
                color: #000;
                border-color: var(--primary);
            }
        }

        .card-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            filter: blur(8px) saturate(0.5);
            opacity: 0.15;
            background-size: cover;
            background-position: center;
            transition: opacity 0.5s, filter 0.5s;
        }
        
        .project-card:hover .card-bg {
            opacity: 0.3;
            filter: blur(2px) saturate(1);
        }

        .card-content-wrap {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .card-date {
            font-size: 0.75rem;
            color: #888;
            font-family: 'Space Mono', monospace;
            margin-bottom: auto;
        }

        .project-card h3 {
            font-family: 'Syne', sans-serif;
            font-size: 1.6rem;
            margin: 0.5rem 0;
            color: #fff;
            line-height: 1.2;
        }

        .project-card p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #bbb;
            flex-grow: 1;
            margin: 1rem 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 1.5rem;
        }

        .filter-tag {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            padding: 6px 10px;
            background: rgba(0, 188, 212, 0.1);
            color: var(--primary);
            border: 1px solid transparent;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            z-index: 2; /* sopre al click della card intera per non triggerarla */
        }

        .filter-tag:hover, .filter-tag:focus-visible {
            background: var(--primary);
            color: #000;
            outline: none;
        }

        .card-cta {
            display: block;
            width: 100%;
            padding: 0.8rem;
            text-align: center;
            background: transparent;
            color: #fff;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-family: var(--font-ui);
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            z-index: 1;
        }



        /* --- OVERLAYS --- */
        .overlay-full {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(5, 5, 15, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .overlay-full.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* --- MATH DEBRIS TEXT (Legacy needed for galaxy 3D texts) --- */
        .font-1 { font-family: 'Caveat', cursive !important; font-size: 1.3em; }
        .font-2 { font-family: 'Space Mono', monospace !important; font-weight: 700; }
        .font-3 { font-family: 'Abril Fatface', serif !important; }
        .font-4 { font-family: 'Permanent Marker', cursive !important; transform: rotate(-2deg); }
        .font-5 { font-family: 'Righteous', cursive !important; }
        .font-6 { font-family: 'Cinzel', serif !important; font-weight: 700; }
        .font-7 { font-family: 'Amatic SC', cursive !important; font-size: 1.5em; font-weight: 700; }
        .font-8 { font-family: 'Oswald', sans-serif !important; text-transform: uppercase; }
        .font-9 { font-family: 'Press Start 2P', cursive !important; font-size: 0.7em; color: #0f0; }
        .font-10 { font-family: 'Playfair Display', serif !important; font-style: italic; }

        .tag-content {
            display: inline-block;
            font-weight: 700;
            color: white;
            padding: 4px 8px;
            white-space: nowrap;
            cursor: pointer;
            pointer-events: auto;
            will-change: transform, opacity;
            transition: color 0.2s;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            backface-visibility: hidden;
        }

        .math-debris {
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            will-change: transform, opacity;
            contain: layout style;
        }
        .debris-hex {
            position: absolute;
            width: 6px;
            height: 6px;
            background: rgba(255, 255, 255, 0.3);
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
        }
        .debris-sym {
            position: relative;
            z-index: 1;
            color: #fff;
            white-space: nowrap;
            transition: opacity 0.3s;
            text-shadow: 0 0 8px rgba(0, 188, 212, 0.4);
            font-family: 'KaTeX_Main', serif;
            will-change: opacity, transform;
        }

        @media (max-width: 768px) {
            .nav-content {
                flex-direction: column;
                align-items: stretch;
                gap: 1rem;
            }
            .nav-links {
                justify-content: flex-start;
                overflow-x: auto;
                padding-bottom: 0.5rem;
                scrollbar-width: none; /* Hide scrollbar Firefox */
            }
            .nav-links::-webkit-scrollbar {
                display: none; /* Hide scrollbar Chrome/Safari */
            }
            .nav-tab {
                white-space: nowrap;
                font-size: 0.85rem;
                padding: 0.4rem 0.8rem;
            }
            #main-nav {
                padding: 1rem;
            }
            .brand-orfini {
                font-size: 1.2rem;
            }
            #search-input {
                width: 100%;
            }
            .list-grid {
                grid-template-columns: 1fr;
            }
            #hero {
                height: clamp(200px, 30vh, 350px);
            }
            #main-content {
                padding: 2rem 1rem;
            }
        }
    </style>
</head>

<body>

    <nav id="main-nav">
        <div class="nav-content">
            <div class="brand-container">
                <div class="brand-orfini">ORFINI</div>
                <div class="brand-sub">MATH LAB</div>
            </div>
            <div class="nav-links">
                <button class="nav-tab active" data-category="all">Tutti</button>
                <button class="nav-tab" data-category="arcade">Gamification & Sfide</button>
                <button class="nav-tab" data-category="memory">Carte & Memory</button>
                <button class="nav-tab" data-category="sim">Simulatori 3D/WebGL</button>
                <a href="verifiche.html" class="nav-tab" style="color: var(--primary); border: 1px solid rgba(0, 188, 212, 0.3); margin-left: 0.5rem; display: flex; align-items: center; gap: 5px;">
                    <span>Archivio Verifiche</span>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                </a>
                <button class="nav-tab" id="btn-bio" style="color: var(--secondary); font-weight: 800; border-left: 1px solid rgba(255,255,255,0.1); margin-left: 0.5rem; padding-left: 1rem;">d::b</button>
            </div>
            <div class="nav-search">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="search-input" placeholder="Cerca attività, argomenti, software..." aria-label="Cerca contenuti">
            </div>
        </div>
    </nav>

    <header id="hero" role="banner">
        <div id="scene-container"></div>
    </header>

    <main id="main-content">
        <div class="list-grid" id="full-list-grid" role="region" aria-live="polite"></div>
    </main>



    <div id="media-modal" class="overlay-full">
        <div id="modal-box" style="width:95%; max-width:1100px; margin: auto;"></div>
    </div>

    <script type="module">
        import { GalaxyScene } from './content/assets/js/modules/GalaxyScene.js?v=5';
        import { UIManager } from './content/assets/js/modules/UIManager.js?v=5';

        function getUniqueTags(data) {
            const counts = {};
            const tagMap = {};
            
            // Regex per escludere date (formati dd-mm-yy, dd/mm/yy, ecc.)
            const datePattern = /\d{1,2}[/-]\d{1,2}[/-]\d{2,4}/;
            const yearPattern = /202\d/;

            data.forEach(item => {
                const tags = item.tags || [];
                tags.forEach(tag => {
                    const key = String(tag).trim().toLowerCase();
                    if(!key || key.length < 2) return;
                    
                    // Salta se è una data
                    if(datePattern.test(key) || yearPattern.test(key)) return;

                    counts[key] = (counts[key] || 0) + 1;
                    if(!tagMap[key]) tagMap[key] = tag.trim(); 
                });
            });
            return Object.keys(counts).map(key => ({ text: tagMap[key], count: counts[key] }));
        }

        window.addEventListener('load', () => {
            const initApp = () => {
                try {
                    const allData = db;
                    const galaxyData = getUniqueTags(allData);
                    
                    const app3D = new GalaxyScene('scene-container', galaxyData, allData, (nodeData) => {
                        const input = document.getElementById('search-input');
                        input.value = nodeData.text;
                        input.dispatchEvent(new Event('input'));
                        document.getElementById('main-content').scrollIntoView({behavior: 'smooth', block: 'start'});
                    });
                    
                    const ui = new UIManager(db, app3D);

                    document.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape') ui.closeModal();
                    });

                    document.getElementById('media-modal').onclick = () => ui.closeModal();
                    document.getElementById('modal-box').onclick = (e) => e.stopPropagation();
                } catch (err) {
                    console.error("Hub Init Failure:", err);
                }
            };

            // Check for KaTeX before starting
            if (typeof katex === 'undefined') {
                let attempts = 0;
                const checkKatex = setInterval(() => {
                    attempts++;
                    if (typeof katex !== 'undefined' || attempts > 30) {
                        clearInterval(checkKatex);
                        initApp();
                    }
                }, 50);
            } else {
                initApp();
            }
        });
    </script>
</body>

</html>
